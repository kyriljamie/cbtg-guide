<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#121412">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CBTG Staff">
<title>CBTG Staff</title>
<link rel="icon" href="../img/favicon-48.png">
<link rel="apple-touch-icon" href="../img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F4EFE4; --surface:#FFFDF7; --fg:#1B261E; --muted:#5D675F; --line:#E4DDCD;
  --night:#121412; --night-2:#1E211E; --night-line:rgba(255,255,255,.16); --on-night:#F6F1E6; --on-night-muted:rgba(246,241,230,.72);
  --forest:#2F5D3A; --forest-ink:#FFFFFF; --sage:#E2EBDF;
  --gold:#D8B978; --brown:#8A6326; --brown-soft:#F1E6CF;
  --ok:#2E6B3F; --ok-soft:#DDEADF; --warn:#8A4B0F; --warn-soft:#FBE7C7; --orange:#C97B2A;
  --bad:#B3261E; --bad-soft:#F7E1DE; --blue:#2A6FB8; --blue-soft:#E3EDF8;
  --display:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --body:'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --shadow:0 1px 2px rgba(27,38,30,.05), 0 6px 18px rgba(27,38,30,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1511; --surface:#18201A; --fg:#ECE7DA; --muted:#A3AB9E; --line:#2B352D;
  --night:#0A110C; --night-2:#16241A; --forest:#7DB68A; --forest-ink:#0D150F; --sage:#203126;
  --brown:#D6B06A; --brown-soft:#2C2618; --ok:#8FC09A; --ok-soft:#1D2D21; --warn:#E9B66B; --warn-soft:#33270F; --orange:#E09A4F;
  --bad:#F2A49B; --bad-soft:#3A1F1C; --blue:#8DB8E8; --blue-soft:#18263A; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1511; --surface:#18201A; --fg:#ECE7DA; --muted:#A3AB9E; --line:#2B352D;
  --night:#0A110C; --night-2:#16241A; --forest:#7DB68A; --forest-ink:#0D150F; --sage:#203126;
  --brown:#D6B06A; --brown-soft:#2C2618; --ok:#8FC09A; --ok-soft:#1D2D21; --warn:#E9B66B; --warn-soft:#33270F; --orange:#E09A4F;
  --bad:#F2A49B; --bad-soft:#3A1F1C; --blue:#8DB8E8; --blue-soft:#18263A; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
p{margin:0}
h1,h2,h3{font-family:var(--display);font-weight:500;margin:0;line-height:1.08;letter-spacing:-.005em}
.app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.small{font-size:.86rem}
.muted{color:var(--muted)}
.hide{display:none!important}

/* ---------- dark header band ---------- */
.hero{background:var(--night);color:var(--on-night);border-radius:0 0 30px 30px;padding:calc(18px + env(safe-area-inset-top)) 20px 34px;position:relative}
.hero.tall{padding-bottom:64px}
.hero-row{display:flex;align-items:center;gap:12px;min-height:48px}
.hero .eyebrow{color:var(--gold)}
.hero h1{font-size:2.6rem;margin-top:14px;color:var(--on-night)}
.eyebrow{font-size:.74rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--brown)}
.logo{width:44px;height:44px;border-radius:50%;flex:none;display:block;box-shadow:0 0 0 1px rgba(216,185,120,.35)}
.brand{font-family:var(--display);font-size:1.6rem;letter-spacing:.14em;color:var(--on-night);font-weight:500}
.back{width:48px;height:48px;border-radius:50%;border:1px solid var(--night-line);background:rgba(255,255,255,.06);color:var(--on-night);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.back svg{width:22px;height:22px}
.grow{flex:1;min-width:0}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--gold);color:#1B261E;font-weight:600;font-size:1.1rem;border:0;cursor:pointer;flex:none}
.hverse{margin-top:14px;font-family:var(--display);font-style:italic;font-size:1.22rem;line-height:1.38;color:var(--on-night)}
.hverse .ref{font-style:normal;color:var(--gold);font-size:1.02rem;white-space:nowrap}
.vmore{background:none;border:0;padding:8px 0 0;color:var(--on-night-muted);font-size:.82rem;font-weight:500;cursor:pointer;min-height:36px}
.vbody{margin-top:8px;padding-top:10px;border-top:1px solid var(--night-line);display:flex;flex-direction:column;gap:8px;font-size:.92rem;color:var(--on-night-muted)}
.vbody .tl{font-style:italic;color:var(--on-night)}
.menu-pop{position:absolute;right:20px;top:calc(72px + env(safe-area-inset-top));background:var(--surface);color:var(--fg);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:6px;z-index:5;min-width:160px}
.menu-pop button{display:block;width:100%;text-align:left;background:none;border:0;padding:12px 14px;border-radius:10px;cursor:pointer;font-weight:500}
.menu-pop button:hover{background:var(--sage)}

/* ---------- body ---------- */
.body{padding:20px 20px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px;flex:1}
.lift{margin-top:-40px;position:relative;z-index:1}
.card{background:var(--surface);border-radius:24px;padding:20px;box-shadow:var(--shadow);border:1px solid var(--line)}
.section{font-size:.74rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:6px 0 -4px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.86rem;font-weight:600;border-radius:999px;padding:5px 14px;white-space:nowrap}
.chip.cleaning{background:var(--warn-soft);color:var(--warn)}
.chip.clean{background:var(--ok-soft);color:var(--ok)}
.chip.ready{background:var(--night);color:#F6F1E6}
.chip.none{background:var(--sage);color:var(--muted)}
.chip.due{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.error{background:var(--bad-soft);color:var(--bad);border-radius:14px;padding:12px 14px;font-weight:600}
.notice{background:var(--ok-soft);color:var(--ok);border-radius:14px;padding:12px 14px;font-weight:600}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:600;font-size:1.05rem;border-radius:18px;border:0;min-height:58px;padding:0 20px;width:100%;cursor:pointer;text-decoration:none}
.btn svg{width:22px;height:22px;flex:none}
.btn.primary{background:var(--forest);color:var(--forest-ink)}
.btn.outline{background:var(--surface);color:var(--fg);border:1.5px solid var(--line)}
.btn.brown{background:var(--surface);color:var(--brown);border:1.5px solid color-mix(in srgb,var(--brown) 70%,transparent)}
.btn:disabled{background:#9DA89E;color:#1B261E;opacity:.85;cursor:not-allowed}
.btn.outline:disabled,.btn.brown:disabled{background:var(--surface);opacity:.45}
.sticky{position:sticky;bottom:0;margin:4px -20px calc(-28px - env(safe-area-inset-bottom));padding:14px 20px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 78%,transparent);display:flex;flex-direction:column;gap:8px;z-index:2}
.row2{display:flex;gap:12px}
.row2 > .btn:first-child{flex:0 0 38%}

/* ---------- login ---------- */
.login{background:var(--night);color:var(--on-night);min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:calc(48px + env(safe-area-inset-top)) 24px calc(28px + env(safe-area-inset-bottom));text-align:center}
.login .logo{width:132px;height:132px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.login .eyebrow{color:var(--gold);margin-top:22px;font-size:.82rem;letter-spacing:.2em}
.login .prompt{margin-top:40px;font-size:1.1rem;color:var(--on-night)}
.dots{display:flex;gap:18px;justify-content:center;margin:20px 0 6px;min-height:20px}
.dots i{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--gold);display:block}
.dots i.on{background:var(--gold)}
.dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.lmsg{min-height:44px;font-size:.92rem;color:#F2B8B0;display:flex;align-items:center;justify-content:center}
.lmsg.busy{color:var(--on-night-muted)}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:16px 26px;justify-content:center;margin-top:4px}
.key{width:76px;height:76px;border-radius:50%;border:1px solid var(--night-line);background:var(--night-2);color:var(--on-night);font-family:var(--display);font-size:2.1rem;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center}
.key:active{background:#2B2F2B}
.key.plain{background:none;border-color:transparent}
.key svg{width:30px;height:30px}
.key.go{background:var(--gold);color:#1B261E;border-color:var(--gold)}
.key:disabled{opacity:.25;cursor:default}
.lfoot{margin-top:auto;padding-top:28px;display:flex;align-items:center;gap:10px;color:var(--on-night-muted);font-size:.95rem}
.lfoot svg{width:18px;height:18px}

/* ---------- home ---------- */
.prog{display:flex;align-items:center;gap:22px}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-family:var(--display);font-size:2.6rem;font-weight:500;line-height:1}
.ring .num span{font-size:.82rem;color:var(--muted)}
.bars{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
.bar-top{display:flex;justify-content:space-between;gap:8px;font-size:.95rem}
.bar-top b{font-weight:600}
.bar-top span{color:var(--muted)}
.track{height:9px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:6px}
.track > div{height:100%;border-radius:9px;background:var(--forest);transition:width .3s}
.track > div.part{background:var(--orange)}
.cheer{margin-top:18px;background:var(--ok-soft);color:var(--ok);border-radius:16px;padding:12px 16px;display:flex;gap:12px;align-items:center;font-weight:500}
.cheer svg{width:20px;height:20px;flex:none}
.tile{display:flex;flex-direction:column;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:var(--shadow);cursor:pointer;gap:4px;min-height:150px}
.tile .ic{width:58px;height:58px;border-radius:16px;background:var(--sage);color:var(--forest);display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.tile .ic svg{width:26px;height:26px}
.tile h3{font-size:1.8rem}
.tile p{color:var(--muted);font-size:.95rem}
.tile .head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;width:100%}
.tile .chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;padding-top:8px}
.tiles2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tiles2 .tile h3{font-size:1.5rem;white-space:nowrap}
.alert{border-radius:20px;padding:14px 16px;background:var(--bad-soft);color:var(--bad);font-weight:600;display:flex;gap:10px;align-items:flex-start}
.ocular{border-radius:22px;padding:16px 18px;background:var(--blue-soft);border:1px solid color-mix(in srgb,var(--blue) 30%,transparent)}
.ocular h2{font-size:1.4rem;margin-bottom:6px;color:var(--fg)}
.ocular ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ocular li{padding:10px 0;border-top:1px solid color-mix(in srgb,var(--blue) 20%,transparent);display:flex;flex-direction:column;gap:2px}
.ocular li:first-child{border-top:0;padding-top:2px}
.ocular .t{font-weight:600;color:var(--blue)}
.ocular a{color:var(--forest);font-weight:600}

/* ---------- cabin status ---------- */
.cabin{display:flex;flex-direction:column;gap:14px}
.cabin-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.cabin h2{font-size:2.2rem}
.who{display:flex;gap:10px 22px;align-items:flex-end}
.who .k{display:block;font-size:.74rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.who .v{font-size:1.1rem;font-weight:500;white-space:nowrap}
.who .tasks{margin-left:auto;color:var(--muted);font-size:1rem;text-align:right;white-space:nowrap}
.arrive{font-size:.92rem;color:var(--muted)}
.arrive.today{color:var(--bad);font-weight:600}

/* ---------- checklist ---------- */
.ptop{display:flex;justify-content:space-between;align-items:baseline;gap:10px;color:var(--muted)}
.ptop b{color:var(--fg);font-weight:600}
.startbtn{background:var(--brown-soft);color:var(--brown);border:0;border-radius:999px;padding:6px 14px;font-weight:600;font-size:.86rem;cursor:pointer;min-height:36px}
.tasks{padding:4px 20px}
.task{display:flex;align-items:center;gap:18px;padding:16px 0;border-top:1px solid var(--line);cursor:pointer;user-select:none;min-height:64px}
.task:first-child{border-top:0}
.task input{position:absolute;opacity:0;width:1px;height:1px}
.task .box{width:42px;height:42px;border-radius:50%;border:2px solid #869287;flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
.task .box svg{width:20px;height:20px;opacity:0}
.task input:checked + .box{background:var(--forest);border-color:var(--forest)}
.task input:checked + .box svg{opacity:1}
.task input:focus-visible + .box{outline:2px solid var(--gold);outline-offset:2px}
.task .txt{font-size:1.05rem}
.task input:checked ~ .txt{text-decoration:line-through;color:var(--muted)}
textarea{font:inherit;width:100%;min-height:80px;border-radius:18px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:14px 16px}
textarea:focus,input:focus{outline:2px solid var(--gold);outline-offset:1px}
label.lbl{font-size:.74rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* ---------- photos ---------- */
.phead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.phead b{font-size:1.15rem;font-weight:600}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ptile{position:relative;height:150px;border-radius:22px;overflow:hidden}
.ptile.need{border:2px dashed color-mix(in srgb,var(--brown) 75%,transparent);background:var(--surface)}
.ptile.have{background:#C8D9C9}
.ptile .cam{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;text-align:center;padding:10px}
.ptile.need .cam svg{width:30px;height:30px;color:var(--brown)}
.ptile.need .cam b{color:var(--brown);font-weight:600;font-size:1.05rem;line-height:1.2}
.ptile.need .cam span{color:var(--muted);font-size:.86rem}
.ptile input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.ptile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ptile.have .cam{justify-content:flex-end;align-items:flex-start;text-align:left;padding:14px 16px;background:linear-gradient(to top,rgba(200,217,201,.96) 38%,rgba(200,217,201,0) 80%)}
.ptile.have.withimg .cam{background:linear-gradient(to top,rgba(10,20,12,.75),rgba(10,20,12,0) 65%)}
.ptile.have .cam b{font-weight:600;color:#1B261E;font-size:1.02rem}
.ptile.have .cam span{color:#3D4A40;font-size:.86rem}
.ptile.have.withimg .cam b,.ptile.have.withimg .cam span{color:#fff}
.ptile .tick{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;background:var(--forest);color:#fff;display:flex;align-items:center;justify-content:center;pointer-events:none}
.ptile .tick svg{width:18px;height:18px}
.ptile .gal{position:absolute;left:10px;top:10px;z-index:2;font-size:.74rem;font-weight:600;color:var(--brown);background:var(--brown-soft);border-radius:999px;padding:5px 10px;cursor:pointer;overflow:hidden}
.ptile .gal input{position:absolute;inset:0;opacity:0;cursor:pointer}
.ptile .err{position:absolute;left:8px;right:8px;bottom:8px;z-index:2;font-size:.74rem;line-height:1.3;color:var(--bad);background:var(--bad-soft);border-radius:10px;padding:6px 8px}
.ptile.busy .cam{background:rgba(255,253,247,.86)}

/* ---------- supplies ---------- */
.sitem{display:flex;align-items:center;gap:12px;padding:16px 16px 16px 20px}
.sitem .nm{flex:1;min-width:0}
.sitem .nm b{display:block;font-size:1.1rem;font-weight:500}
.sitem .nm span{color:var(--muted);font-size:.92rem}
.sitem .nm span strong{color:var(--fg);font-weight:600}
.lowchip{display:inline-block;margin-top:6px;background:var(--warn-soft);color:var(--warn);font-weight:600;font-size:.82rem;border-radius:999px;padding:3px 12px}
.step{width:48px;height:48px;border-radius:50%;flex:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.step svg{width:20px;height:20px}
.step.minus{border:1.5px solid var(--forest);background:var(--surface);color:var(--forest)}
.step.plus{border:0;background:var(--forest);color:var(--forest-ink)}
.qty{width:54px;height:48px;border:0;background:none;color:var(--fg);font-family:var(--display);font-size:2rem;font-weight:500;text-align:center;flex:none;padding:0;-moz-appearance:textfield}
.qty::-webkit-outer-spin-button,.qty::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.qty::placeholder{color:#B8B09E}
.ptrack{height:9px;border-radius:9px;background:var(--line);overflow:hidden}
.ptrack > div{height:100%;background:var(--forest);border-radius:9px;transition:width .2s}

/* ---------- who's coming ---------- */
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.days button{flex:none;scroll-snap-align:start;min-width:64px;min-height:64px;border-radius:16px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:6px 10px;position:relative}
.days button b{font-family:var(--display);font-size:1.5rem;font-weight:500;line-height:1}
.days button span{font-size:.7rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.days button.on{background:var(--night);border-color:var(--night);color:#F6F1E6}
.days button.on span{color:var(--gold)}
.days button i{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--orange)}
.ev{display:flex;flex-direction:column;gap:2px;padding-top:12px;margin-top:12px;border-top:1px solid var(--line)}
.ev .k{font-size:.74rem;font-weight:600;text-transform:uppercase;letter-spacing:.12em}
.ev .k.in{color:var(--ok)} .ev .k.out{color:var(--bad)} .ev .k.stay{color:var(--warn)}
.ev .g{font-weight:600;font-size:1.05rem}
.nlist{list-style:none;margin:0;padding:0}
.nlist li{display:flex;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.nlist li:first-child{border-top:0}
.nlist .d{font-weight:600;min-width:96px}
.nlist .d.today{color:var(--bad)}

/* ---------- guest praise ---------- */
.praise-head{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 -4px}
.praise-head .section{margin:0}
.praise-head .count{font-size:.74rem;font-weight:600;letter-spacing:.16em;color:var(--brown)}
.slides{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:0 -20px;padding:4px 20px 6px}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;display:flex;flex-direction:column;gap:8px;background:#121412;border-color:#121412;color:#F6F1E6;padding:16px 18px}
.slide .qrow{display:flex;justify-content:space-between;align-items:flex-start}
.slide .qmark{font-family:var(--display);font-size:3.6rem;line-height:.62;height:26px;color:#D8B978;font-weight:600}
.pbadge{font-size:.8rem;font-weight:600;border-radius:999px;padding:4px 12px;background:rgba(216,185,120,.16);color:#D8B978;border:1px solid rgba(216,185,120,.35)}
.slide blockquote{margin:0;font-family:var(--display);font-style:italic;font-size:1.18rem;line-height:1.36;white-space:pre-line;color:#F6F1E6}
.slide blockquote.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}

<body>
<main class="app" id="app" aria-live="polite"></main>
<script>
// CBTG staff portal. Talks only to the CBTG Supabase functions (staff_login / staff_mark /
// staff_stock / staff_photo), which check the PIN, checklist and photos on the server.
const API = 'https://fnebydfckdqgigtfhjfk.supabase.co/rest/v1/rpc/';
const KEY = 'sb_publishable_PLLPO77LyLTlHHQr1yF23Q_Y27vUAO1';
const STORE = 'cbtg-staff-v1';
const LOGO = '../img/logo-320.png';

const state = { verse: null, verseOpen: false, pin: null, entry: '', me: null, data: null, view: null, cabin: null, ticks: {}, note: '', msg: null, busy: false, done: null, whoDate: null, counts: {}, stockNote: '', preview: {}, uploading: null, photoErr: {}, menu: false, praise: null, praiseOpen: {}, progress: null };
const app = document.getElementById('app');

// ---------- icons (Lucide, inline) ----------
const IC = {
  back: '<path d="m15 18-6-6 6-6"/>',
  chev: '<path d="m9 18 6-6-6-6"/>',
  home: '<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  box: '<path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><path d="m3.3 7 7.703 4.734a2 2 0 0 0 1.994 0L20.7 7"/>',
  cal: '<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>',
  cam: '<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  minus: '<path d="M5 12h14"/>',
  plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
  del: '<path d="M10 5a2 2 0 0 0-1.344.519l-6.328 5.74a1 1 0 0 0 0 1.481l6.328 5.741A2 2 0 0 0 10 19h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/><path d="m12 9 6 6"/><path d="m18 9-6 6"/>',
  lock: '<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  eye: '<path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/>',
  arrow: '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
  refresh: '<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
};
// Two-tone (duotone) icons: a soft filled shape under the outline, in the same colour.
const ICF = {
  home: '<path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  box: '<path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/>',
  cal: '<rect width="18" height="18" x="3" y="4" rx="2"/>',
  cam: '<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/>',
  lock: '<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>',
  del: '<path d="M10 5a2 2 0 0 0-1.344.519l-6.328 5.74a1 1 0 0 0 0 1.481l6.328 5.741A2 2 0 0 0 10 19h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/>',
  eye: '<circle cx="12" cy="12" r="3"/>',
  refresh: '<circle cx="12" cy="12" r="5"/>',
};
const icon = (n, sw) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (sw || 1.9) + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
  (ICF[n] ? '<g fill="currentColor" fill-opacity=".22" stroke="none">' + ICF[n] + '</g>' : '') + IC[n] + '</svg>';

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE) || '{}'); state.pin = s.pin || null; state.ticks = s.ticks || {};
    // Opening the camera can make the phone reload this page. Come back to the same screen.
    if (s.cabin && s.cabinAt && Date.now() - s.cabinAt < 3 * 3600 * 1000) { state.cabin = s.cabin; state.view = s.view === 'photos' ? 'photos' : 'cabin'; }
  } catch (e) { /* storage blocked */ }
}
function save() {
  const keep = (state.view === 'cabin' || state.view === 'photos') && state.cabin;
  try { localStorage.setItem(STORE, JSON.stringify({ pin: state.pin, ticks: state.ticks, cabin: keep ? state.cabin : null, view: keep ? state.view : null, cabinAt: keep ? Date.now() : 0 })); } catch (e) { /* ignore */ }
}
async function rpc(fn, body) {
  const res = await fetch(API + fn, { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!res.ok) throw new Error('No connection to CBTG (' + res.status + '). Check your data / Wi-Fi and try again.');
  return res.json();
}
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const timeText = (iso) => new Date(iso).toLocaleString('en-PH', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
const clock = (iso) => new Date(iso).toLocaleTimeString('en-PH', { hour: 'numeric', minute: '2-digit' });
const isTodayIso = (iso) => { const d = new Date(iso); return localIso(d) === todayIso(); };
const localIso = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const todayIso = () => localIso(new Date());
// The server keeps the old cabin numbers; staff see the cat names.
const CAT = { 'Cabin 1': 'Charlie', 'Cabin 2': 'Charlotte', 'Cabin 3': 'Choco' };
const shortName = (c) => CAT[c] || String(c).replace(/^cabin\s+/i, '');
const cabinTitle = (c) => 'Cabin ' + shortName(c);
const firstName = (s) => String(s || '').trim().split(/\s+/)[0];

async function login(pin) {
  state.busy = true; state.msg = null; render();
  try {
    const r = await rpc('staff_login', { p_pin: pin });
    if (r.error) { state.msg = { kind: 'error', text: r.error }; state.pin = null; state.entry = ''; save(); }
    else { state.pin = pin; state.me = r.name; state.data = r; save(); loadPraise(); loadProgress(); }
  } catch (e) { state.msg = { kind: 'error', text: e.message }; if (!state.me) state.entry = ''; }
  state.busy = false; render();
}
// Everyone's ticks (so all phones see the same progress). If this fails, the page
// simply counts this phone's ticks, like before.
async function loadProgress() {
  try {
    const r = await rpc('staff_progress', { p_pin: state.pin });
    if (r && r.lens) { state.progress = r; if (state.me && (!state.view || state.view === 'status') && !state.done) { const y = window.scrollY; render(); window.scrollTo(0, y); } }
  } catch (e) { /* keep the old numbers */ }
}
// Save my ticks online a moment after the last tap. The first tick also marks the cabin
// "Cleaning" (same as tapping "I'm starting to clean").
const tickTimers = {};
function syncTicks(c) {
  clearTimeout(tickTimers[c]);
  tickTimers[c] = setTimeout(async () => {
    const list = (state.data && state.data.checklist) || [];
    const items = list.filter((_, i) => (state.ticks[c] || {})[i]);
    try {
      const parts = (state.data.parts || (state.data.parts = {}));
      const mine = (parts[c] || {})[state.me];
      if (items.length && (!mine || mine.status !== 'cleaning') && !(mine && mine.status === 'ready' && !items.length)) {
        if (!mine) {
          const r = await rpc('staff_mark', { p_pin: state.pin, p_cabin: c, p_status: 'cleaning', p_items: [], p_note: '' });
          if (r && r.at) { (parts[c] || (parts[c] = {}))[state.me] = { status: 'cleaning', at: r.at }; }
        }
      }
      await rpc('staff_tick', { p_pin: state.pin, p_cabin: c, p_items: items });
    } catch (e) { /* ticks stay on this phone; they'll go up with the next tick */ }
    if (state.view === 'cabin' && state.cabin === c) { const y = window.scrollY; renderChecklist(); window.scrollTo(0, y); }
  }, 700);
}
// Keep Home and Cabin Status fresh while they're open.
setInterval(() => {
  if (document.hidden || !state.me || state.busy || state.uploading) return;
  if (!state.view || state.view === 'status') refresh();
}, 60000);
// Guest praise comes separately so the main screens never wait for it.
async function loadPraise() {
  try {
    const r = await rpc('staff_praise', { p_pin: state.pin });
    if (r && Array.isArray(r.praise)) { state.praise = r.praise; if (state.me && !state.view && !state.done) { const y = window.scrollY; render(); window.scrollTo(0, y); } }
  } catch (e) { /* no praise today: the card just stays hidden */ }
}
async function refresh() { if (state.pin) await login(state.pin); }

async function mark(status) {
  const cabin = state.cabin;
  const items = (state.data.checklist || []).filter((_, i) => (state.ticks[cabin] || {})[i]);
  state.busy = true; state.msg = null; render();
  try {
    const r = await rpc('staff_mark', { p_pin: state.pin, p_cabin: cabin, p_status: status, p_items: status === 'ready' ? items : [], p_note: state.note });
    if (r.error) { state.msg = { kind: 'error', text: r.error }; }
    else if (status === 'ready') {
      delete state.ticks[cabin]; state.note = '';
      rpc('staff_tick', { p_pin: state.pin, p_cabin: cabin, p_items: [] }).catch(() => {});
      state.cabin = null; state.view = null; save();
      await refresh();
      const parts = ((state.data && state.data.parts) || {})[cabin] || {};
      const waiting = ((state.data && state.data.team) || []).filter((n) => n !== r.name && !(parts[n] && parts[n].status === 'ready'));
      state.done = { cabin, at: r.at, name: r.name, waiting };
      // The done screen is one step deep: drop any extra steps (e.g. came via Photos).
      const have = (history.state && history.state.cbtgDepth) || 0;
      if (have > 1) history.go(-(have - 1));
    } else {
      state.msg = { kind: 'ok', text: 'Started cleaning ' + cabinTitle(cabin) + ' · ' + clock(r.at) };
      await refresh();
    }
  } catch (e) { state.msg = { kind: 'error', text: e.message }; }
  state.busy = false; render();
  if (state.msg && state.msg.kind === 'error') window.scrollTo(0, 0);
}

function msgHtml() {
  if (!state.msg) return '';
  return '<p class="' + (state.msg.kind === 'error' ? 'error' : 'notice') + '" role="status">' + esc(state.msg.text) + '</p>';
}

// ---------- navigation ----------
// Every inner screen adds one history step, so the phone's Back button / swipe returns to
// Home instead of leaving the page: Photos → tasks → Cabin Status → Home.
const depth = () => (!state.me ? 0 : state.done ? 1 : state.view === 'photos' ? 3 : state.view === 'cabin' ? 2 : state.view ? 1 : 0);
function syncHistory() {
  const want = depth();
  const have = (history.state && history.state.cbtgDepth) || 0;
  if (want > have) for (let i = have + 1; i <= want; i++) history.pushState({ cbtgDepth: i }, '');
}
function go(view, extra) { Object.assign(state, { view, msg: null, menu: false }, extra || {}); save(); render(); window.scrollTo(0, 0); }
function goHome() { state.done = null; state.view = null; state.cabin = null; state.msg = null; save(); render(); window.scrollTo(0, 0); }
function goBack() { if (history.state && history.state.cbtgDepth) history.back(); else popView(); }
function popView() {
  if (state.done) { state.done = null; }
  else if (state.view === 'photos') { state.view = 'cabin'; }
  else if (state.view === 'cabin') { state.view = 'status'; state.cabin = null; }
  else { state.view = null; state.cabin = null; }
  state.msg = null; save(); render(); window.scrollTo(0, 0);
}
window.addEventListener('popstate', (e) => {
  const at = (e.state && e.state.cbtgDepth) || 0;
  let guard = 5;
  while (depth() > at && guard--) popView();
});

function render() {
  if (!state.me) return renderLogin();
  syncHistory();
  if (state.done) return renderDone();
  if (state.view === 'status') return renderStatus();
  if (state.view === 'cabin' && state.cabin) return renderChecklist();
  if (state.view === 'photos' && state.cabin) return renderPhotos();
  if (state.view === 'stock') return renderStock();
  if (state.view === 'who') return renderWho();
  return renderHome();
}

// Dark header used by every inner screen.
function hero(eyebrow, title, right) {
  return `<header class="hero"><div class="hero-row">
      <button class="back" id="back" aria-label="Back">${icon('back')}</button>
      <p class="eyebrow grow">${eyebrow}</p>${right || ''}
      <img class="logo" src="${LOGO}" alt="CBTG" width="44" height="44">
    </div><h1>${title}</h1></header>`;
}
function wireBack() { const b = document.getElementById('back'); if (b) b.onclick = goBack; }

// ---------- login: PIN keypad ----------
function renderLogin() {
  const n = state.entry.length;
  const slots = Math.max(4, n);
  const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'go', '0', 'del'];
  app.innerHTML = `<section class="login">
    <img class="logo" src="${LOGO}" alt="Cabins by the Generals" width="132" height="132">
    <p class="eyebrow">Staff Portal</p>
    <p class="prompt">Enter your PIN to continue</p>
    <div class="dots${state.msg && state.msg.kind === 'error' && !state.busy ? ' shake' : ''}" aria-label="${n} digits entered">${Array.from({ length: slots }, (_, i) => '<i class="' + (i < n ? 'on' : '') + '"></i>').join('')}</div>
    <p class="lmsg${state.busy ? ' busy' : ''}" role="status">${state.busy ? 'Checking…' : state.msg ? esc(state.msg.text) : ''}</p>
    <div class="pad">${keys.map((k) => k === 'del'
      ? `<button class="key plain" data-k="del" aria-label="Delete">${icon('del', 1.8)}</button>`
      : k === 'go'
        ? `<button class="key ${n >= 4 ? 'go' : 'plain'}" data-k="go" aria-label="Log in" ${n >= 4 && !state.busy ? '' : 'disabled'}>${n >= 4 ? icon('arrow') : ''}</button>`
        : `<button class="key" data-k="${k}" ${state.busy ? 'disabled' : ''}>${k}</button>`).join('')}</div>
    <p class="lfoot">${icon('lock')} Stays logged in on this phone</p>
  </section>`;
  app.querySelectorAll('.key').forEach((b) => (b.onclick = () => press(b.dataset.k)));
}
function press(k) {
  if (state.busy) return;
  if (k === 'del') state.entry = state.entry.slice(0, -1);
  else if (k === 'go') { if (state.entry.length >= 4) return login(state.entry); }
  else if (state.entry.length < 6) state.entry += k;
  state.msg = null; renderLogin();
}
document.addEventListener('keydown', (e) => {
  if (state.me) return;
  if (/^[0-9]$/.test(e.key)) press(e.key);
  else if (e.key === 'Backspace') press('del');
  else if (e.key === 'Enter') press('go');
});

// ---------- schedule helpers ----------
// New app versions send every stay for the next 30 days (marked s:1), with the
// next 3 arrivals flagged; older versions sent just the next 3.
const isSchedule = (list) => list.some((b) => b && b.s);
const nextOf = (list) => (isSchedule(list) ? list.filter((b) => b.next) : list);
const addDaysIso = (iso, n) => { const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n); return localIso(d); };
const paxText = (g) => (g ? g + '&nbsp;guest' + (g === 1 ? '' : 's') : '');
const dayText = (iso) => new Date(iso + 'T00:00:00').toLocaleDateString('en-PH', { weekday: 'short', month: 'short', day: 'numeric' });

// Ocular visits (people coming to see the place before booking). Sent by app 1.21.2+.
const time12 = (t) => { const m = /^(\d{1,2}):(\d{2})$/.exec(t || ''); if (!m) return esc(t); const h = +m[1]; return (h % 12 || 12) + ':' + m[2] + ' ' + (h < 12 ? 'AM' : 'PM'); };
function ocularHtml(list, title) {
  if (!list.length) return '';
  return `<section class="ocular" aria-label="${esc(title)}"><h2>${esc(title)}</h2><ul>${list.map((v) => {
    const tel = String(v.phone || '').replace(/[^\d+]/g, '');
    return `<li><span class="t">${time12(v.time)}</span><span><b>${esc(v.name)}</b>${tel ? ' · <a href="tel:' + esc(tel) + '">' + esc(v.phone) + '</a>' : ''}</span>
      <span class="small muted">Show: ${esc((v.cabins || []).length ? v.cabins.map(cabinTitle).join(', ') : 'all cabins')}${v.note ? ' · ' + esc(v.note) : ''}</span></li>`;
  }).join('')}</ul><p class="small muted" style="margin-top:6px">Please have these cabins clean and open before they arrive.</p></section>`;
}
const visitsOn = (d, iso) => (d.ocular || []).filter((v) => v.date === iso).sort((a, b) => String(a.time).localeCompare(String(b.time)));

// ---------- verse for today ----------
// The morning task writes staff/verse.json each day (same verse as the group chat
// message). If it's missing or not today's, a verse from the list below is shown instead.
const VERSES = [
  ['Carry each other\'s burdens.', 'Galatians 6:2', 'Magtulungan kayo sa pagdadala ng inyong mga pasanin.'],
  ['Dear friends, let us love one another, for love comes from God.', '1 John 4:7', 'Mga minamahal, magmahalan tayo, sapagkat ang pag-ibig ay mula sa Diyos.'],
  ['How good and pleasant it is when God\'s people live together in unity!', 'Psalm 133:1', 'Napakabuti at napakaligaya kapag ang magkakapatid ay namumuhay nang may pagkakaisa!'],
  ['Whatever you do, work at it with all your heart, as working for the Lord.', 'Colossians 3:23', 'Anuman ang inyong gawin, gawin ninyo nang buong puso, na parang para sa Panginoon.'],
  ['I can do all this through him who gives me strength.', 'Philippians 4:13', 'Magagawa ko ang lahat ng bagay sa tulong ng nagbibigay sa akin ng lakas.'],
  ['This is the day the Lord has made; let us rejoice and be glad in it.', 'Psalm 118:24', 'Ito ang araw na ginawa ng Panginoon; tayo\'y magalak at magsaya.'],
  ['Be kind and compassionate to one another.', 'Ephesians 4:32', 'Maging mabait at mahabagin kayo sa isa\'t isa.'],
  ['Be devoted to one another in love.', 'Romans 12:10', 'Magmahalan kayo bilang magkakapatid.'],
  ['Two are better than one, because they have a good return for their labor.', 'Ecclesiastes 4:9', 'Mas mabuti ang dalawa kaysa sa isa, sapagkat mas malaki ang bunga ng kanilang pagpapagal.'],
  ['Come to me, all you who are weary and burdened, and I will give you rest.', 'Matthew 11:28', 'Lumapit kayo sa akin, kayong lahat na napapagal at nabibigatan, at bibigyan ko kayo ng kapahingahan.'],
  ['Those who hope in the Lord will renew their strength.', 'Isaiah 40:31', 'Ang mga umaasa sa Panginoon ay muling lalakas.'],
  ['Do everything in love.', '1 Corinthians 16:14', 'Gawin ninyo ang lahat nang may pag-ibig.'],
  ['A friend loves at all times.', 'Proverbs 17:17', 'Ang tunay na kaibigan ay nagmamahal sa lahat ng panahon.'],
  ['Give thanks in all circumstances.', '1 Thessalonians 5:18', 'Magpasalamat kayo sa lahat ng pagkakataon.'],
];
function fallbackVerse(iso) {
  const d = new Date(iso + 'T00:00:00');
  const day = Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
  const v = VERSES[day % VERSES.length];
  return { date: iso, en: v[0], ref: v[1], tl: v[2], note: 'Iisang pamilya tayo sa CBTG — salamat sa pagmamahal at pagtutulungan ninyo araw-araw! 💚' };
}
async function loadVerse() {
  const today = todayIso();
  if (state.verse && state.verse.date === today) return;
  let v = null;
  try {
    const res = await fetch('verse.json?d=' + today, { cache: 'no-store' });
    if (res.ok) { const j = await res.json(); if (j && j.date === today && j.en) v = j; }
  } catch (e) { /* offline: use the built-in list */ }
  state.verse = v || fallbackVerse(today);
  const box = document.getElementById('verse');
  if (box) { box.outerHTML = verseHtml(); wireVerse(); }
}
function verseHtml() {
  const v = state.verse;

// ---------- cabin status helpers ----------
// Each cleaner has their own part per cabin (status cleaning / ready + time).
function cabinState(c) {
  const d = state.data;
  const parts = (d.parts || {})[c] || {};
  const team = d.team || [];
  const mine = parts[state.me];
  // Everyone's ticks are saved online (staff_progress); mine come straight from this phone.
  const prog = state.progress || {};
  const lens = prog.lens || { [state.me]: (d.checklist || []).length };
  const others = (prog.ticks || {})[c] || {};
  const members = team.length ? team : [state.me];
  const ticked = Object.values(state.ticks[c] || {}).filter(Boolean).length;
  const allReady = team.length > 0 && team.every((n) => parts[n] && parts[n].status === 'ready');
  let tasksTotal = 0, tasksDone = 0;
  const tickTimes = [];
  members.forEach((n) => {
    const len = Number(lens[n]) || (n === state.me ? (d.checklist || []).length : 0);
    tasksTotal += len;
    const p = parts[n];
    const o = others[n];
    if (o && o.n) tickTimes.push(o.at);
    if (p && p.status === 'ready' && !(n === state.me && ticked)) tasksDone += len;
    else tasksDone += Math.min(len, n === state.me ? ticked : (o ? Number(o.n) || 0 : 0));
  });
  const slots = slotsFor(c);
  const have = photosFor(c);
  const photosTotal = slots.length;
  const photosHave = slots.filter((x) => have[x.id]).length;
  const total = tasksTotal + photosTotal;
  const done = allReady ? total : Math.min(total, tasksDone + photosHave);
  const anyCleaning = members.some((n) => parts[n] && parts[n].status === 'cleaning');
  const anyReady = members.some((n) => parts[n] && parts[n].status === 'ready');
  const working = !allReady && (anyCleaning || ticked > 0 || tickTimes.length > 0 || (photosHave > 0 && !anyReady));
  const status = allReady ? 'ready' : working ? 'cleaning' : anyReady ? 'clean' : 'none';
  const times = members.map((n) => parts[n]).filter(Boolean);
  const started = times.filter((p) => p.status === 'cleaning').map((p) => p.at)
    .concat(tickTimes, slots.map((x) => have[x.id] && have[x.id].at).filter(Boolean)).sort()[0] || null;
  const finished = allReady ? times.map((p) => p.at).sort().slice(-1)[0] : null;
  return { parts, team, total, done, status, started, finished, mine, tasksTotal: allReady ? tasksTotal : tasksTotal, tasksDone: allReady ? tasksTotal : tasksDone, photosTotal, photosHave };
}
const STATUS_LABEL = { ready: 'Ready', cleaning: 'Cleaning', clean: 'Part done', none: 'Not started' };

// ---------- guest praise ----------
// New praise (last 3 days) shows first with a "New" badge. The rest of the card is the
// praise of the day: a different set from everything saved, every day.
const DAY_MS = 86400000;
function praiseSlides() {
  const all = state.praise || [];
  if (!all.length) return [];
  const fresh = all.filter((p) => Date.now() - new Date(p.at) < 3 * DAY_MS).slice(0, 3);
  const pool = all.filter((p) => !fresh.includes(p)).sort((a, b) => a.id - b.id);
  const out = fresh.map((p) => ({ p, isNew: true }));
  const day = Math.floor(Date.parse(todayIso() + 'T00:00:00Z') / DAY_MS);
  const start = pool.length ? (day * 3) % pool.length : 0;
  for (let i = 0; out.length < 3 && i < pool.length; i++) out.push({ p: pool[(start + i) % pool.length], isNew: false });
  return out;
}
const initials = (n) => String(n || 'Guest').trim().split(/\s+/).slice(0, 2).map((w) => w.charAt(0).toUpperCase()).join('');
function praiseWhen(iso) {
  const d = new Date(iso);
  return Date.now() - d < 90 * DAY_MS ? d.toLocaleDateString('en-PH', { month: 'short', day: 'numeric' }) : d.toLocaleDateString('en-PH', { month: 'short', year: 'numeric' });
}
function praiseHtml() {
  const slides = praiseSlides();
  if (!slides.length) return '';
  return `<div class="praise-head"><p class="section">What guests are saying</p><span class="count" id="pcount">1 OF ${slides.length}</span></div>
    <div class="slides" id="slides" aria-roledescription="carousel">${slides.map(({ p, isNew }, i) => {
      const open = state.praiseOpen[p.id];
      const long = String(p.message).length > 140 || String(p.message).split('\n').length > 3;
      const where = [p.cabin ? 'Cabin ' + p.cabin : p.source || '', praiseWhen(p.at)].filter(Boolean).join(' · ');
      return `<section class="card slide" aria-label="Praise ${i + 1} of ${slides.length}">
        <div class="qrow"><span class="qmark" aria-hidden="true">“</span><span class="pbadge">${isNew ? 'New' : i === (slides.findIndex((x) => !x.isNew)) ? 'Praise of the day' : esc(p.source || 'Guest')}</span></div>
        <blockquote class="${long && !open ? 'clamp' : ''}">${esc(p.message)}</blockquote>
        ${long ? '<button class="pmore" data-pid="' + p.id + '">' + (open ? 'Show less' : 'Read more') + '</button>' : ''}
        <div class="pby"><span class="ini" aria-hidden="true">${esc(initials(p.guest))}</span><span class="who2"><b>${esc(p.guest || 'A guest')}</b><span>${esc(where)}</span></span><span class="thx">Thank you,<br>team!</span></div>
      </section>`;
    }).join('')}</div>
    ${slides.length > 1 ? '<div class="pdots" id="pdots" aria-hidden="true">' + slides.map((_, i) => '<i class="' + (i === 0 ? 'on' : '') + '"></i>').join('') + '</div>' : ''}`;
}
function wirePraise() {
  const box = document.getElementById('slides');
  if (!box) return;
  const n = box.children.length;
  box.onscroll = () => {
    const i = Math.round(box.scrollLeft / (box.clientWidth || 1));
    const c = document.getElementById('pcount'); if (c) c.textContent = (Math.min(i, n - 1) + 1) + ' OF ' + n;
    document.querySelectorAll('#pdots i').forEach((d, k) => d.classList.toggle('on', k === i));
  };
  box.querySelectorAll('.pmore').forEach((b) => (b.onclick = () => {
    const x = box.scrollLeft, y = window.scrollY;
    state.praiseOpen[b.dataset.pid] = !state.praiseOpen[b.dataset.pid];
    renderHome(); window.scrollTo(0, y); const nb = document.getElementById('slides'); if (nb) nb.scrollLeft = x;
  }));
}

// ---------- supply count (stock check) ----------
function lowList(d, counts) {
  return (d.stock || []).filter((i) => typeof counts[i.id] === 'number' && counts[i.id] <= (i.lowAt || 0))
    .map((i) => esc(i.name) + ' ' + counts[i.id] + (i.unit ? ' ' + esc(i.unit) : ''));
}
function openStock() { go('stock', { counts: {}, stockNote: '' }); }

function renderStock() {
  const d = state.data;
  const items = d.stock || [];
  const filled = items.filter((i) => state.counts[i.id] !== undefined && state.counts[i.id] !== '').length;
  const all = items.length > 0 && filled === items.length;
  const last = d.stockLast;
  app.innerHTML = `${hero('Stock room', 'Supplies')}
    <div class="body">
      ${msgHtml()}
      <p class="small muted">Count what's in the supply room now. Type the number or use − / +. ${last ? 'Last counted ' + esc(timeText(last.at)) + ' by ' + esc(last.staff) + '.' : ''}</p>
      <div><div class="ptrack" role="progressbar" aria-valuemin="0" aria-valuemax="${items.length}" aria-valuenow="${filled}"><div style="width:${items.length ? (filled / items.length) * 100 : 0}%"></div></div>
        <p class="small muted" style="margin-top:6px">${filled} of ${items.length} counted</p></div>
      ${items.map((i) => {
        const v = state.counts[i.id];
        const has = v !== undefined && v !== '';
        const lastN = last && last.counts && typeof last.counts[i.id] === 'number' ? last.counts[i.id] : null;
        const shown = has ? Number(v) : (i.expected !== null && i.expected !== undefined ? i.expected : lastN);
        const isLow = shown !== null && shown !== undefined && Number(shown) <= (i.lowAt || 0);
        const unit = i.unit ? ' ' + esc(i.unit) : '';
        return `<div class="card sitem">
          <div class="nm"><b>${esc(i.name)}</b><span>${has ? 'Counted: <strong>' + esc(v) + unit + '</strong>' : shown !== null && shown !== undefined ? 'Balance: <strong>' + shown + unit + '</strong>' : 'First count'}</span>${isLow ? '<br><span class="lowchip">Low stock</span>' : ''}</div>
          <button class="step minus" data-id="${esc(i.id)}" data-d="-1" aria-label="One less ${esc(i.name)}">${icon('minus')}</button>
          <input class="qty" data-id="${esc(i.id)}" type="number" inputmode="numeric" min="0" step="1" value="${has ? esc(v) : ''}" placeholder="${shown !== null && shown !== undefined ? shown : '?'}" aria-label="${esc(i.name)} count">
          <button class="step plus" data-id="${esc(i.id)}" data-d="1" aria-label="One more ${esc(i.name)}">${icon('plus')}</button>
        </div>`;
      }).join('')}
      <label for="snote" class="lbl">Note for the owner (optional)</label>
      <textarea id="snote" placeholder="e.g. what to buy">${esc(state.stockNote)}</textarea>
      <div class="sticky">
        <button class="btn primary" id="ssend" ${!all || state.busy ? 'disabled' : ''}>${state.busy ? 'Sending…' : all ? 'Submit count' : 'Count every item (' + (items.length - filled) + ' left)'}</button>
      </div>
    </div>`;
  wireBack();
  document.getElementById('snote').oninput = (e) => { state.stockNote = e.target.value; };
  const keep = (fn) => { const y = window.scrollY; fn(); renderStock(); window.scrollTo(0, y); };
  app.querySelectorAll('.step').forEach((b) => (b.onclick = () => keep(() => {
    const id = b.dataset.id; const cur = state.counts[id];
    const inp = app.querySelector('.qty[data-id="' + CSS.escape(id) + '"]');
    const base = cur === undefined || cur === '' ? Number(inp && inp.placeholder !== '?' ? inp.placeholder : 0) || 0 : Number(cur);
    state.counts[id] = String(Math.max(0, base + Number(b.dataset.d)));
  })));
  app.querySelectorAll('.qty').forEach((inp) => {
    inp.onchange = () => keep(() => { const n = inp.value.trim(); state.counts[inp.dataset.id] = n === '' ? '' : String(Math.max(0, Math.round(Number(n)) || 0)); });
  });
  document.getElementById('ssend').onclick = () => sendStock();
}

async function sendStock() {
  const counts = {};
  for (const [k, v] of Object.entries(state.counts)) if (v !== '' && v !== undefined) counts[k] = Number(v);
  state.busy = true; state.msg = null; render();
  try {
    const r = await rpc('staff_stock', { p_pin: state.pin, p_counts: counts, p_note: state.stockNote });
    if (r.error) state.msg = { kind: 'error', text: r.error };
    else {
      const low = lowList(state.data, counts);
      state.counts = {}; state.stockNote = '';
      await refresh();
      state.view = null;
      if (history.state && history.state.cbtgDepth) history.back();
      state.msg = { kind: 'ok', text: 'Supply count sent · ' + timeText(r.at) + (low.length ? '. Low: ' + low.join(', ').replace(/<[^>]+>/g, '') : '. Nothing low.') };
    }
  } catch (e) { state.msg = { kind: 'error', text: e.message }; }
  state.busy = false; render();
}

    const evs = [];
    const who = (b) => '<span class="g">' + (b.guest ? esc(b.guest) : 'Guest') + '</span><span class="small muted">' +
      [paxText(Number(b.guests) || 0), (b.cabins || []).length > 1 ? esc(b.cabins.map(shortName).join(' + ')) + ' booking' : ''].filter(Boolean).join(' · ') + '</span>';
    out.forEach((b) => { outs++; evs.push('<div class="ev"><span class="k out">Check-out 12:00 NN</span>' + who(b) + '</div>'); });
    stay.forEach((b) => {
      const n = Math.round((new Date(sel + 'T00:00:00') - new Date(b.checkIn + 'T00:00:00')) / 86400000) + 1;
      if (b.checkIn === sel) { ins++; pax += Number(b.guests) || 0; evs.push('<div class="ev"><span class="k in">Check-in 4:00 PM</span>' + who(b) + '<span class="small muted">' + b.nights + ' night' + (b.nights === 1 ? '' : 's') + ' · out ' + esc(dayText(b.checkOut)) + '</span></div>'); }
      else { pax += Number(b.guests) || 0; evs.push('<div class="ev"><span class="k stay">Staying · night ' + n + ' of ' + b.nights + '</span>' + who(b) + '</div>'); }
    });
    return '<section class="card"><h2 style="font-size:1.8rem">' + esc(cabinTitle(c)) + '</h2>' +
      (evs.length ? evs.join('') : '<p class="muted" style="margin-top:6px">No guests — free tonight</p>') + '</section>';
  }).join('');
  const label = new Date(sel + 'T00:00:00').toLocaleDateString('en-PH', { weekday: 'long', month: 'long', day: 'numeric' });
  const sum = [ins ? ins + ' check-in' + (ins === 1 ? '' : 's') : '', outs ? outs + ' check-out' + (outs === 1 ? '' : 's') : '', pax ? pax + ' guests tonight' : ''].filter(Boolean).join(' · ') || 'No guests';
  const nv = visitsOn(d, sel).length;
  app.innerHTML = `${hero('Who’s coming', sel === today ? 'Today' : sel === addDaysIso(today, 1) ? 'Tomorrow' : esc(dayText(sel)))}
    <div class="body">
      <div class="days" id="days" role="group" aria-label="Pick a day">${days.map(chip).join('')}</div>
      <p><b>${esc(label)}</b><br><span class="small muted">${sum}${nv ? ' · ' + nv + ' ocular visit' + (nv === 1 ? '' : 's') : ''}</span></p>
      ${ocularHtml(visitsOn(d, sel), 'Ocular visits')}
      ${cards}
      <p class="small muted">A dot on a day means guests check in or out, or someone comes to see the place. Check-in 4:00 PM · Check-out 12:00 NN.</p>
      <button class="btn outline" id="ref">${icon('refresh', 1.8)} Refresh</button>
    </div>`;
  wireBack();
  document.getElementById('ref').onclick = () => refresh();
  const strip = document.getElementById('days');
  strip.querySelectorAll('button').forEach((b) => (b.onclick = () => { const x = strip.scrollLeft; state.whoDate = b.dataset.day; render(); document.getElementById('days').scrollLeft = x; }));
  const on = strip.querySelector('.on');
  if (on && strip.scrollLeft === 0) on.scrollIntoView({ block: 'nearest', inline: 'center' });
}

// ---------- required cleaning photos ----------
// The server says which photos each cabin needs (photoSlots) and which are already in
// (photos). Ready stays locked until every one is uploaded; the server checks it too.
const slotsFor = (c) => ((state.data && state.data.photoSlots) || {})[c] || [];
const photosFor = (c) => ((state.data && state.data.photos) || {})[c] || {};
const missingPhotos = (c) => slotsFor(c).filter((s) => !photosFor(c)[s.id]);

// Big camera photos can fail to open on low-memory phones, so try two ways.
async function decodePhoto(file) {
  if (window.createImageBitmap) {
    try { const b = await createImageBitmap(file); return { src: b, w: b.width, h: b.height, done: () => b.close && b.close() }; } catch (e) { /* try the other way */ }
  }
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => resolve({ src: img, w: img.naturalWidth, h: img.naturalHeight, done: () => URL.revokeObjectURL(url) });
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('This phone could not open that photo. Take it again, or pick it from the Gallery.')); };
    img.src = url;
  });
}
async function shrinkPhoto(file) {
  if (!file || !file.size) throw new Error('No photo came back from the camera. Try again.');
  const im = await decodePhoto(file);
  try {
    if (!im.w || !im.h) throw new Error('This phone could not open that photo. Try again.');
    let max = 1080, data = '';
    while (max >= 640) {
      const k = Math.min(1, max / Math.max(im.w, im.h));
      const cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.round(im.w * k)); cv.height = Math.max(1, Math.round(im.h * k));
      const g = cv.getContext('2d');
      g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height);
      g.drawImage(im.src, 0, 0, cv.width, cv.height);
      let q = 0.62; data = cv.toDataURL('image/jpeg', q);
      while (data.length > 300000 && q > 0.35) { q -= 0.1; data = cv.toDataURL('image/jpeg', q); }
      if (data.startsWith('data:image/jpeg') && data.length > 3000) return data;
      max -= 220; // the phone ran out of memory: try smaller
    }
    throw new Error('This phone could not shrink that photo. Close other apps and try again.');
  } finally { im.done(); }
}

async function sendPhoto(body) {
  let last = null;
  for (let attempt = 1; attempt <= 3; attempt++) {
    const ctl = window.AbortController ? new AbortController() : null;
    const timer = ctl ? setTimeout(() => ctl.abort(), 60000) : null;
    try {
      const res = await fetch(API + 'staff_photo', { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal: ctl ? ctl.signal : undefined });
      const text = await res.text();
      if (!res.ok) throw new Error('Upload failed (code ' + res.status + '). ' + text.slice(0, 120));
      return JSON.parse(text);
    } catch (e) {
      last = e.name === 'AbortError' ? new Error('Upload is taking too long. Check the signal / Wi-Fi and try again.') : e;
      if (/code 4\d\d/.test(last.message)) break; // the server said no: retrying won't help
      await new Promise((r) => setTimeout(r, 1500 * attempt));
    } finally { if (timer) clearTimeout(timer); }
  }
  throw new Error(last && last.name === 'TypeError' ? 'No connection. Check the signal / Wi-Fi and try again.' : (last ? last.message : 'Upload failed. Try again.'));
}

async function uploadPhoto(c, slot, file) {
  state.uploading = slot.id; state.msg = null; delete state.photoErr[c + '|' + slot.id];
  const y = window.scrollY; render(); window.scrollTo(0, y);
  try {
    const dataUrl = await shrinkPhoto(file);
    const r = await sendPhoto({ p_pin: state.pin, p_cabin: c, p_slot: slot.id, p_data: dataUrl.split(',')[1] });
    if (r.error) throw new Error(r.error);
    const info = { at: r.at, staff: r.name };
    const all = state.data.photos || (state.data.photos = {});
    // The shared Outdoor CR counts for every cabin that needs it.
    const cabins = slot.shared ? Object.keys(state.data.photoSlots || {}).filter((x) => slotsFor(x).some((s) => s.id === slot.id)) : [c];
    cabins.forEach((x) => { (all[x] || (all[x] = {}))[slot.id] = info; state.preview[x + '|' + slot.id] = dataUrl; });
  } catch (e) { state.photoErr[c + '|' + slot.id] = e.message || 'Upload failed. Try again.'; }
  state.uploading = null;
  const y2 = window.scrollY; render(); window.scrollTo(0, y2);
}

function renderPhotos() {
  const c = state.cabin;
  const slots = slotsFor(c);
  const have = photosFor(c);
  const done = slots.filter((s) => have[s.id]).length;
  const left = slots.length - done;
  app.innerHTML = `${hero('Photo checklist', esc(cabinTitle(c)))}
    <div class="body">
      ${msgHtml()}
      ${slots.length ? `<div class="phead"><b>${done} of ${slots.length} areas uploaded</b><span class="muted small">All required</span></div>
      <div class="pgrid">${slots.map((s) => {
        const p = have[s.id];
        const pv = state.preview[c + '|' + s.id];
        const busy = state.uploading === s.id;
        const err = state.photoErr[c + '|' + s.id];
        const dis = state.uploading ? 'disabled' : '';
        const cls = 'ptile ' + (p ? 'have' : 'need') + (pv && p ? ' withimg' : '') + (busy ? ' busy' : '');
        const inner = busy ? '<b>Uploading…</b><span>' + esc(s.label) + '</span>'
          : p ? '<b>' + esc(s.label) + '</b><span>Uploaded ' + esc(clock(p.at)) + (p.staff && p.staff !== state.me ? ' · ' + esc(p.staff) : '') + '</span>'
          : icon('cam', 1.8) + '<b>' + esc(s.label) + '</b><span>Tap to add photo</span>';
        return `<div class="${cls}">
          ${pv && p ? '<img src="' + pv + '" alt="">' : ''}
          <label class="cam">${inner}<input type="file" accept="image/*" capture="environment" data-slot="${esc(s.id)}" aria-label="${p ? 'Retake' : 'Take'} photo: ${esc(s.label)}" ${dis}></label>
          ${p ? '<span class="tick">' + icon('check', 2.5) + '</span>' : ''}
          ${!busy ? '<label class="gal">Gallery<input type="file" accept="image/*" data-slot="' + esc(s.id) + '" aria-label="Pick from gallery: ' + esc(s.label) + '" ' + dis + '></label>' : ''}
          ${err ? '<span class="err" role="alert">' + esc(err) + '</span>' : ''}
        </div>`;
      }).join('')}</div>
      <p class="small muted">Tap a box to take the photo, or tap <b>Gallery</b> to pick one. Tap a done box to retake.${slots.some((s) => s.shared) ? ' The Outdoor CR is shared — one photo a day covers every cabin.' : ''}</p>`
      : '<p class="muted">No photos needed for this cabin.</p>'}
      <div class="sticky">
        <button class="btn primary" id="pdone" ${left && slots.length ? 'disabled' : ''}>${!slots.length || !left ? 'Done — back to tasks' : 'Submit photos (' + left + ' left)'}</button>
      </div>
    </div>`;
  wireBack();
  document.getElementById('pdone').onclick = goBack;
  app.querySelectorAll('.ptile input[type=file]').forEach((inp) => (inp.onchange = () => {
    const f = inp.files && inp.files[0];
    const slot = slotsFor(c).find((s) => s.id === inp.dataset.slot);
    if (f && slot) uploadPhoto(c, slot, f);
  }));
}

// ---------- cleaning checklist ----------
function renderChecklist() {
  const c = state.cabin;
  const list = state.data.checklist || [];
  const t = state.ticks[c] || (state.ticks[c] = {});
  const n = list.filter((_, i) => t[i]).length;
  const all = list.length > 0 && n === list.length;
  const miss = missingPhotos(c).length;
  const s = cabinState(c);
  const canReady = all && miss === 0 && !state.uploading;
  const mineCleaning = s.mine && s.mine.status === 'cleaning';
  const readyText = state.busy ? 'Saving…' : !list.length ? 'No checklist yet'
    : !all ? 'Mark cabin as clean'
    : miss ? miss + ' photo' + (miss === 1 ? '' : 's') + ' to go'
    : 'Mark cabin as clean';
  app.innerHTML = `${hero('Assigned to ' + esc(firstName(state.me)), esc(cabinTitle(c)), '<span class="chip ' + s.status + '">' + STATUS_LABEL[s.status] + '</span>')}
    <div class="body">
      ${msgHtml()}
      <div>
        <div class="ptop"><span>${mineCleaning ? 'Started ' + esc(clock(s.mine.at)) : '<button class="startbtn" id="start" ' + (state.busy ? 'disabled' : '') + '>I’m starting to clean</button>'}</span><b>${n} of ${list.length} done</b></div>
        <div class="ptrack" style="margin-top:10px" role="progressbar" aria-valuemin="0" aria-valuemax="${list.length}" aria-valuenow="${n}"><div style="width:${list.length ? (n / list.length) * 100 : 0}%"></div></div>
      </div>
      ${list.length ? `<section class="card tasks">${list.map((item, i) => `<label class="task"><input type="checkbox" data-i="${i}" ${t[i] ? 'checked' : ''}><span class="box">${icon('check', 2.5)}</span><span class="txt">${esc(item)}</span></label>`).join('')}</section>` : '<p class="muted">No checklist yet — ask the owner.</p>'}
      <label for="note" class="lbl">Note for the owner (optional)</label>
      <textarea id="note" placeholder="e.g. something broken, supplies running low">${esc(state.note)}</textarea>
      <div class="sticky">
        ${all && miss ? '<p class="small muted" style="text-align:center">Take the photos to finish — tap Photos.</p>' : ''}
        <div class="row2">
          <button class="btn brown" id="photos" ${slotsFor(c).length ? '' : 'disabled'}>${icon('cam', 1.8)} Photos</button>
          <button class="btn primary" id="ready" ${!canReady || state.busy ? 'disabled' : ''}>${readyText}</button>
        </div>
      </div>
    </div>`;
  wireBack();
  document.getElementById('note').oninput = (e) => { state.note = e.target.value; };
  app.querySelectorAll('.task input').forEach((cb) => (cb.onchange = () => {
    t[cb.dataset.i] = cb.checked; save(); syncTicks(c);
    const y = window.scrollY; renderChecklist(); window.scrollTo(0, y);
  }));
  const st = document.getElementById('start');
  if (st) st.onclick = () => mark('cleaning');
  document.getElementById('ready').onclick = () => mark('ready');
  document.getElementById('photos').onclick = () => go('photos');
}

function renderDone() {
  const d = state.done;
  const hasStock = state.data && (state.data.stock || []).length;
  app.innerHTML = `<header class="hero"><div class="hero-row"><img class="logo" src="${LOGO}" alt="" width="44" height="44"><span class="brand grow">CBTG</span></div>
      <h1>${d.waiting && d.waiting.length ? 'Your part is done' : 'Cabin ready'}</h1></header>
    <div class="body">
      <section class="card donecard">
        <span class="big">${icon('check', 2.5)}</span>
        <h2>${d.waiting && d.waiting.length ? 'Your part of ' + esc(cabinTitle(d.cabin)) + ' is done' : esc(cabinTitle(d.cabin)) + ' is Ready'}</h2>
        <p class="muted">Recorded for ${esc(d.name)} · ${timeText(d.at)}</p>
        <p class="small muted">${d.waiting && d.waiting.length ? esc(cabinTitle(d.cabin)) + ' becomes fully Ready when ' + esc(d.waiting.join(' and ')) + ' finish' + (d.waiting.length === 1 ? 'es' : '') + ' too.' : 'Everyone is done — ' + esc(cabinTitle(d.cabin)) + ' is fully Ready.'} The owner's CBTG app will show it shortly. Salamat!</p>
      </section>
      ${hasStock ? '<button class="btn primary" id="cnt">' + icon('box', 1.8) + ' Count the supplies now</button>' : ''}
      <button class="btn ${hasStock ? 'outline' : 'primary'}" id="ok">Back to Home</button>
    </div>`;
  document.getElementById('ok').onclick = () => { state.done = null; goHomeHist(); };
  const cnt = document.getElementById('cnt');
  if (cnt) cnt.onclick = () => { state.done = null; state.view = 'stock'; state.counts = {}; state.stockNote = ''; render(); window.scrollTo(0, 0); };
}
// Leave every inner screen at once (after Ready).
function goHomeHist() {
  const at = (history.state && history.state.cbtgDepth) || 0;
  state.view = null; state.cabin = null; state.msg = null; save();
  if (at > 0) history.go(-at); else render();
  render(); window.scrollTo(0, 0);
}

load();
if (state.pin) login(state.pin); else render();
</script>
