<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2F5D3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CBTG Staff">
<title>CBTG Staff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#F5F2EA; --surface:#FFFDF8; --fg:#1E2A21; --muted:#5E6A5F; --line:#DCD6C6;
  --forest:#2F5D3A; --forest-ink:#FFFFFF; --gold:#9A7428; --gold-soft:#F1E6CB; --chip:#E8EFE6;
  --ok:#2E6B3F; --ok-soft:#DDEFE1; --warn:#8A5A00; --warn-soft:#FBEFD5; --bad:#B3261E; --bad-soft:#F7E1DE;
  --display:'DM Serif Display', Georgia, 'Times New Roman', serif;
  --body:'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111511; --surface:#1A201B; --fg:#ECE7DA; --muted:#A6AD9F; --line:#2E362F;
  --forest:#8FC09A; --forest-ink:#10170F; --gold:#D8B566; --gold-soft:#2C2719; --chip:#223024;
  --ok:#8FC09A; --ok-soft:#1E2D21; --warn:#D8B566; --warn-soft:#2C2719; --bad:#F2A49B; --bad-soft:#3A1F1C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111511; --surface:#1A201B; --fg:#ECE7DA; --muted:#A6AD9F; --line:#2E362F;
  --forest:#8FC09A; --forest-ink:#10170F; --gold:#D8B566; --gold-soft:#2C2719; --chip:#223024;
  --ok:#8FC09A; --ok-soft:#1E2D21; --warn:#D8B566; --warn-soft:#2C2719; --bad:#F2A49B; --bad-soft:#3A1F1C; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px calc(40px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:18px;min-height:100dvh}
h1,h2{font-family:var(--display);font-weight:400;margin:0;line-height:1.1}
h1{font-size:2rem}
h2{font-size:1.5rem}
p{margin:0}
.eyebrow{font-size:.72rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.link{background:none;border:0;color:var(--forest);font:inherit;font-weight:700;padding:8px 0;cursor:pointer;min-height:44px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px}
button.btn{font:inherit;font-weight:800;font-size:1.05rem;border-radius:14px;border:0;min-height:56px;padding:0 18px;width:100%;cursor:pointer}
.btn.primary{background:var(--forest);color:var(--forest-ink)}
.btn.secondary{background:var(--surface);color:var(--forest);border:1.5px solid var(--forest)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.pin{font:inherit;font-size:2rem;letter-spacing:.5em;text-align:center;width:100%;min-height:64px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg)}
.pin:focus{outline:2px solid var(--gold);outline-offset:2px}
.error{background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:12px 14px;font-weight:700}
.notice{background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:12px 14px;font-weight:700}
.cabins{display:flex;flex-direction:column;gap:12px}
.cabin{display:flex;align-items:center;gap:12px;text-align:left;width:100%;font:inherit;color:inherit;background:var(--surface);border:2px solid var(--line);border-left-width:6px;border-radius:16px;padding:16px;cursor:pointer;min-height:76px}
.cabin .name{font-weight:800;font-size:1.15rem}
.cabin .meta{font-size:.85rem;color:var(--muted)}
.cabin .go{margin-left:auto;font-size:1.4rem;color:var(--muted)}
.tag{display:inline-block;font-size:.78rem;font-weight:800;border-radius:999px;padding:3px 10px;margin-top:4px}
.tag.ready{background:var(--ok-soft);color:var(--ok)}
.tag.cleaning{background:var(--warn-soft);color:var(--warn)}
.tag.none{background:var(--chip);color:var(--muted)}
.arrive{color:var(--bad);font-weight:800}
.next h2{font-size:1.2rem;margin-bottom:8px}
.next ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.next li{display:flex;gap:12px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line)}
.next li:first-child{border-top:0;padding-top:2px}
.next .d{font-weight:800;min-width:92px}
.next .d.today{color:var(--bad)}
.next .w{flex:1;min-width:0}
.whobtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;border-radius:14px;border:1.5px solid var(--forest);background:var(--surface);color:var(--forest);font:inherit;font-weight:800;font-size:1.05rem;cursor:pointer}
.ocular{border-color:#2A78D6;background:color-mix(in srgb,#2A78D6 8%,var(--surface))}
.ocular h2{font-size:1.2rem;margin-bottom:6px}
.ocular ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ocular li{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.ocular li:first-child{border-top:0;padding-top:2px}
.ocular .t{font-weight:800;color:#2A78D6}
.ocular a{color:var(--forest);font-weight:800}
.backbtn{flex:none;font:inherit;font-weight:800;font-size:1rem;color:var(--forest);background:var(--surface);border:2px solid var(--forest);border-radius:999px;min-height:44px;padding:0 16px;cursor:pointer}
.whobtn small{font-weight:600;color:var(--muted);font-size:.8rem}
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.days button{flex:none;scroll-snap-align:start;min-width:64px;min-height:60px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 10px;position:relative}
.days button b{font-size:1.15rem;line-height:1.1}
.days button span{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.days button.on{background:var(--forest);border-color:var(--forest);color:var(--forest-ink)}
.days button.on span{color:var(--forest-ink)}
.days button i{position:absolute;top:4px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.days button.on i{background:var(--forest-ink)}
.sum{font-weight:700}
.wcab{background:var(--surface);border:2px solid var(--line);border-left:6px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.wcab .cn{font-weight:800;font-size:1.1rem}
.ev{display:flex;flex-direction:column;gap:2px;padding-top:10px;border-top:1px solid var(--line)}
.ev:first-of-type{border-top:0;padding-top:0}
.ev .k{font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.ev .k.in{color:var(--ok)}
.ev .k.out{color:var(--bad)}
.ev .k.stay{color:var(--warn)}
.ev .g{font-weight:700;font-size:1.05rem}
.free{color:var(--muted)}
.stockbox{border:2.5px solid var(--warn);background:var(--warn-soft);color:var(--warn);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.stockbox.ok{border-color:var(--line);background:var(--surface);color:var(--fg)}
.stockbox b{font-size:1.05rem}
.low{color:var(--bad);font-weight:800}
.sitem{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px}
.sitem.done{border-color:var(--ok)}
.sitem .nm{flex:1;min-width:0}
.sitem .nm b{display:block}
.step{width:46px;height:46px;border-radius:12px;border:2px solid var(--forest);background:var(--surface);color:var(--forest);font:inherit;font-size:1.4rem;font-weight:800;cursor:pointer;flex:none}
.qty{width:64px;height:46px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-size:1.2rem;font-weight:800;text-align:center;flex:none}
.qty:focus{outline:2px solid var(--gold);outline-offset:1px}
.progress{height:10px;border-radius:5px;background:var(--chip);overflow:hidden}
.progress > div{height:100%;background:var(--forest);width:0;transition:width .2s}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:14px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px;min-height:60px;cursor:pointer;user-select:none}
.item input{width:28px;height:28px;accent-color:var(--forest);flex:none;margin:0}
.item.done{background:var(--ok-soft);border-color:transparent}
.item.done span{text-decoration:line-through;color:var(--muted)}
textarea{font:inherit;width:100%;min-height:72px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:12px}
.sticky{position:sticky;bottom:0;padding:12px 0 calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 75%,transparent);display:flex;flex-direction:column;gap:8px}
.big-check{font-size:3.5rem;line-height:1}
.verse{border-color:var(--gold);background:var(--gold-soft)}
.verse h2{font-size:1.15rem;margin-bottom:8px}
.verse .en{font-weight:700;margin:0}
.verse .ref{font-weight:800;color:var(--gold);font-size:.9rem;margin:2px 0 8px}
.verse .tl{font-style:italic;margin:0 0 10px}
.verse .enc{margin:0;font-weight:600}
.verse .q{margin:10px 0 0;padding-top:10px;border-top:1px solid var(--line);font-size:.92rem}
.hide{display:none!important}
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"></main>
<script>
// CBTG staff cleaning checklist. Talks only to the CBTG Supabase functions
// (staff_login / staff_mark), which check the PIN and the checklist on the server.
const API = 'https://fnebydfckdqgigtfhjfk.supabase.co/rest/v1/rpc/';
const KEY = 'sb_publishable_PLLPO77LyLTlHHQr1yF23Q_Y27vUAO1';
const STORE = 'cbtg-staff-v1';

const state = { verse: null, pin: null, me: null, data: null, cabin: null, ticks: {}, note: '', msg: null, busy: false, done: null, who: false, whoDate: null, stock: false, counts: {}, stockNote: '' };
const app = document.getElementById('app');

function load() {
  try { const s = JSON.parse(localStorage.getItem(STORE) || '{}'); state.pin = s.pin || null; state.ticks = s.ticks || {}; } catch (e) { /* storage blocked */ }
}
function save() {
  try { localStorage.setItem(STORE, JSON.stringify({ pin: state.pin, ticks: state.ticks })); } catch (e) { /* ignore */ }
}
async function rpc(fn, body) {
  const res = await fetch(API + fn, { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!res.ok) throw new Error('No connection to CBTG (' + res.status + '). Check your data / Wi-Fi and try again.');
  return res.json();
}
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const timeText = (iso) => {
  const d = new Date(iso);
  return d.toLocaleString('en-PH', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
};
const todayIso = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const COLORS = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300'];

async function login(pin) {
  state.busy = true; state.msg = null; render();
  try {
    const r = await rpc('staff_login', { p_pin: pin });
    if (r.error) { state.msg = { kind: 'error', text: r.error }; state.pin = null; save(); }
    else { state.pin = pin; state.me = r.name; state.data = r; save(); }
  } catch (e) { state.msg = { kind: 'error', text: e.message }; }
  state.busy = false; render();
}
async function refresh() { if (state.pin) await login(state.pin); }

async function mark(status) {
  const cabin = state.cabin;
  const items = (state.data.checklist || []).filter((_, i) => (state.ticks[cabin] || {})[i]);
  state.busy = true; state.msg = null; render();
  try {
    const r = await rpc('staff_mark', { p_pin: state.pin, p_cabin: cabin, p_status: status, p_items: status === 'ready' ? items : [], p_note: state.note });
    if (r.error) { state.msg = { kind: 'error', text: r.error }; }
    else if (status === 'ready') {
      delete state.ticks[cabin]; state.note = ''; save();
      state.cabin = null;
      await refresh();
      const parts = ((state.data && state.data.parts) || {})[cabin] || {};
      const waiting = ((state.data && state.data.team) || []).filter((n) => n !== r.name && !(parts[n] && parts[n].status === 'ready'));
      state.done = { cabin, at: r.at, name: r.name, waiting };
    } else {
      state.msg = { kind: 'ok', text: cabin + ' marked Cleaning · ' + timeText(r.at) };
      await refresh();
    }
  } catch (e) { state.msg = { kind: 'error', text: e.message }; }
  state.busy = false; render();
}

function msgHtml() {
  if (!state.msg) return '';
  return '<p class="' + (state.msg.kind === 'error' ? 'error' : 'notice') + '" role="status">' + esc(state.msg.text) + '</p>';
}

// Back navigation: every inner screen (checklist, Who's coming, supplies, done) adds one
// history step, so the phone's Back button / swipe returns to the cabins list instead of
// leaving the page. The on-screen "‹ Back" buttons do the same.
const inSub = () => !!(state.me && (state.done || state.who || state.stock || state.cabin));
function goHome() { state.done = null; state.who = false; state.stock = false; state.cabin = null; state.msg = null; render(); window.scrollTo(0, 0); }
function goBack() { if (history.state && history.state.cbtgSub) history.back(); else goHome(); }
window.addEventListener('popstate', () => { if (inSub()) goHome(); });

function render() {
  const marked = !!(history.state && history.state.cbtgSub);
  if (inSub() && !marked) history.pushState({ cbtgSub: 1 }, '');
  else if (!inSub() && marked) history.back(); // back on the main list by a button: drop the extra step
  if (!state.me) return renderLogin();
  if (state.done) return renderDone();
  if (state.who) return addBottomBack(renderWho());
  if (state.stock) return addBottomBack(renderStock());
  if (state.cabin) return addBottomBack(renderChecklist());
  return renderCabins();
}
function addBottomBack() {
  const b = document.createElement('button');
  b.className = 'btn secondary'; b.type = 'button'; b.textContent = '‹ Back to cabins';
  b.onclick = goBack;
  app.appendChild(b);
}

function renderLogin() {
  app.innerHTML = `
    <div class="top"><div><p class="eyebrow">Cabins by the Generals</p><h1>Staff</h1></div></div>
    <p class="muted">Enter your PIN to mark cabins as cleaned and ready.</p>
    ${msgHtml()}
    <form id="f" class="card" style="display:flex;flex-direction:column;gap:12px">
      <label for="pin" class="small muted">Your PIN</label>
      <input id="pin" class="pin" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" maxlength="6" required>
      <button class="btn primary" ${state.busy ? 'disabled' : ''}>${state.busy ? 'Checking…' : 'Log in'}</button>
    </form>
    <p class="small muted">Tip: tap your browser's menu → “Add to Home screen” to open this like an app.</p>`;
  const f = document.getElementById('f');
  const pin = document.getElementById('pin');
  if (!state.busy) pin.focus();
  f.onsubmit = (e) => { e.preventDefault(); if (pin.value.trim()) login(pin.value.trim()); };
}

// New app versions send every stay for the next 30 days (marked s:1), with the
// next 3 arrivals flagged; older versions sent just the next 3.
const isSchedule = (list) => list.some((b) => b && b.s);
const nextOf = (list) => (isSchedule(list) ? list.filter((b) => b.next) : list);
const addDaysIso = (iso, n) => { const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const paxText = (g) => (g ? g + '&nbsp;guest' + (g === 1 ? '' : 's') : '');

function nextHtml(list, today) {
  list = nextOf(list);
  if (!list.length) return '';
  const day = (iso) => new Date(iso + 'T00:00:00').toLocaleDateString('en-PH', { weekday: 'short', month: 'short', day: 'numeric' });
  return `<section class="card next" aria-label="Next bookings"><h2>Next bookings</h2><ol>${list.map((b) => {
    const isToday = b.checkIn === today;
    const g = Number(b.guests) || 0;
    return `<li><span class="d${isToday ? ' today' : ''}">${isToday ? 'TODAY' : esc(day(b.checkIn))}</span><span class="w">${b.guest ? '<b>' + esc(b.guest) + '</b> · ' : ''}${esc((b.cabins || []).join(' + '))}<br><span class="small muted">${b.nights} night${b.nights === 1 ? '' : 's'} · out ${esc(day(b.checkOut))}${g ? ' · ' + g + '&nbsp;guest' + (g === 1 ? '' : 's') : ''}</span></span></li>`;
  }).join('')}</ol></section>`;
}

// Ocular visits (people coming to see the place before booking). Sent by app 1.21.2+.
const time12 = (t) => { const m = /^(\d{1,2}):(\d{2})$/.exec(t || ''); if (!m) return esc(t); const h = +m[1]; return (h % 12 || 12) + ':' + m[2] + ' ' + (h < 12 ? 'AM' : 'PM'); };
function ocularHtml(list, title) {
  if (!list.length) return '';
  return `<section class="card ocular" aria-label="${esc(title)}"><h2>👀 ${esc(title)}</h2><ul>${list.map((v) => {
    const tel = String(v.phone || '').replace(/[^\d+]/g, '');
    return `<li><span class="t">${time12(v.time)}</span><span><b>${esc(v.name)}</b>${tel ? ' · <a href="tel:' + esc(tel) + '">📞 ' + esc(v.phone) + '</a>' : ''}</span>
      <span class="small muted">Show: ${esc((v.cabins || []).length ? v.cabins.join(', ') : 'all cabins')}${v.note ? ' · ' + esc(v.note) : ''}</span></li>`;
  }).join('')}</ul><p class="small muted" style="margin-top:6px">Please have these cabins clean and open before they arrive.</p></section>`;
}
const visitsOn = (d, iso) => (d.ocular || []).filter((v) => v.date === iso).sort((a, b) => String(a.time).localeCompare(String(b.time)));

// ---------- verse for today ----------
// The morning task writes staff/verse.json each day (same verse as the group chat
// message). If it's missing or not today's, a verse from the list below is shown instead.
const VERSES = [
  ['Carry each other\'s burdens.', 'Galatians 6:2', 'Magtulungan kayo sa pagdadala ng inyong mga pasanin.'],
  ['Dear friends, let us love one another, for love comes from God.', '1 John 4:7', 'Mga minamahal, magmahalan tayo, sapagkat ang pag-ibig ay mula sa Diyos.'],
  ['How good and pleasant it is when God\'s people live together in unity!', 'Psalm 133:1', 'Napakabuti at napakaligaya kapag ang magkakapatid ay namumuhay nang may pagkakaisa!'],
  ['Whatever you do, work at it with all your heart, as working for the Lord.', 'Colossians 3:23', 'Anuman ang inyong gawin, gawin ninyo nang buong puso, na parang para sa Panginoon.'],
  ['I can do all this through him who gives me strength.', 'Philippians 4:13', 'Magagawa ko ang lahat ng bagay sa tulong ng nagbibigay sa akin ng lakas.'],
  ['This is the day the Lord has made; let us rejoice and be glad in it.', 'Psalm 118:24', 'Ito ang araw na ginawa ng Panginoon; tayo\'y magalak at magsaya.'],
  ['Be kind and compassionate to one another.', 'Ephesians 4:32', 'Maging mabait at mahabagin kayo sa isa\'t isa.'],
  ['Be devoted to one another in love.', 'Romans 12:10', 'Magmahalan kayo bilang magkakapatid.'],
  ['Two are better than one, because they have a good return for their labor.', 'Ecclesiastes 4:9', 'Mas mabuti ang dalawa kaysa sa isa, sapagkat mas malaki ang bunga ng kanilang pagpapagal.'],
  ['Come to me, all you who are weary and burdened, and I will give you rest.', 'Matthew 11:28', 'Lumapit kayo sa akin, kayong lahat na napapagal at nabibigatan, at bibigyan ko kayo ng kapahingahan.'],
  ['Those who hope in the Lord will renew their strength.', 'Isaiah 40:31', 'Ang mga umaasa sa Panginoon ay muling lalakas.'],
  ['Do everything in love.', '1 Corinthians 16:14', 'Gawin ninyo ang lahat nang may pag-ibig.'],
  ['A friend loves at all times.', 'Proverbs 17:17', 'Ang tunay na kaibigan ay nagmamahal sa lahat ng panahon.'],
  ['Give thanks in all circumstances.', '1 Thessalonians 5:18', 'Magpasalamat kayo sa lahat ng pagkakataon.'],
];
function fallbackVerse(iso) {
  const d = new Date(iso + 'T00:00:00');
  const day = Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
  const v = VERSES[day % VERSES.length];
  return { date: iso, en: v[0], ref: v[1], tl: v[2], note: 'Iisang pamilya tayo sa CBTG — salamat sa pagmamahal at pagtutulungan ninyo araw-araw! 💚' };
}
async function loadVerse() {
  const today = todayIso();
  if (state.verse && state.verse.date === today) return;
  let v = null;
  try {
    const res = await fetch('verse.json?d=' + today, { cache: 'no-store' });
    if (res.ok) { const j = await res.json(); if (j && j.date === today && j.en) v = j; }
  } catch (e) { /* offline: use the built-in list */ }
  state.verse = v || fallbackVerse(today);
  const box = document.getElementById('verse');
  if (box) box.outerHTML = verseHtml();
}
function verseHtml() {
  const v = state.verse;
  if (!v) return '<div id="verse"></div>';
  return `<section class="card verse" id="verse" aria-label="Verse for today"><h2>🌿 Verse for today</h2>
    <p class="en">“${esc(v.en)}”</p><p class="ref">— ${esc(v.ref)}</p>
    ${v.tl ? '<p class="tl">“' + esc(v.tl) + '”</p>' : ''}
    ${v.note ? '<p class="enc">💚 ' + esc(v.note) + '</p>' : ''}
    ${v.quote ? '<p class="q">✨ “' + esc(v.quote) + '” — ' + esc(v.by || '') + '</p>' : ''}
  </section>`;
}
function renderCabins() {
  const d = state.data;
  const today = todayIso();
  const cabins = d.cabins || [];
  app.innerHTML = `
    <div class="top">
      <div><p class="eyebrow">Hi, ${esc(state.me)}</p><h1>Cabins</h1></div>
      <button class="link" id="out">Log out</button>
    </div>
    ${msgHtml()}
    ${isSchedule(d.upcoming || []) ? '<button class="whobtn" id="who">📅 Who\'s coming <small>guests per cabin, by day</small></button>' : ''}
    ${ocularHtml(visitsOn(d, today), visitsOn(d, today).length === 1 ? 'Ocular visit today' : 'Ocular visits today')}
    ${ocularHtml(visitsOn(d, addDaysIso(today, 1)), 'Ocular visit tomorrow')}
    ${stockBoxHtml(d)}
    ${nextHtml(d.upcoming || [], today)}
    <div class="cabins">
      ${cabins.map((c, i) => {
        const parts = (d.parts || {})[c] || {};
        const team = d.team || [];
        const arr = (d.arrivals || {})[c];
        const ng = Number((d.arrivalGuests || {})[c]) || 0;
        const gTxt = ng ? ' · ' + ng + '&nbsp;guest' + (ng === 1 ? '' : 's') : '';
        const ticked = Object.values(state.ticks[c] || {}).filter(Boolean).length;
        const allDone = team.length > 0 && team.every((n) => parts[n] && parts[n].status === 'ready');
        const tag = allDone
          ? '<span class="tag ready">✓ Ready — everyone done</span>'
          : team.map((n) => {
              const p = parts[n];
              const st = p ? p.status : 'none';
              const label = p ? (p.status === 'ready' ? '✓ ' + esc(n) + ' done ' + timeText(p.at) : esc(n) + ' cleaning') : esc(n) + ' not yet';
              return '<span class="tag ' + st + '">' + label + '</span>';
            }).join(' ');
        return `<button class="cabin" data-c="${esc(c)}" style="border-left-color:${COLORS[i % COLORS.length]}">
          <div>
            <div class="name">${esc(c)}</div>
            <div class="meta">${arr === today ? '<span class="arrive">Guests arrive TODAY 4:00 PM' + gTxt + '</span>' : arr ? 'Next guests ' + new Date(arr + 'T00:00:00').toLocaleDateString('en-PH', { weekday: 'short', month: 'short', day: 'numeric' }) + gTxt : 'No guests coming yet'}${ticked ? ' · ' + ticked + ' ticked' : ''}</div>
            ${tag}
          </div>
          <span class="go" aria-hidden="true">›</span>
        </button>`;
      }).join('')}
    </div>
    <button class="btn secondary" id="ref">Refresh</button>
    ${verseHtml()}`;
  loadVerse();
  document.getElementById('out').onclick = () => { state.pin = null; state.me = null; state.data = null; state.who = false; state.stock = false; save(); state.msg = null; render(); };
  document.getElementById('ref').onclick = () => refresh();
  const sb = document.getElementById('stockgo');
  if (sb) sb.onclick = () => openStock();
  const who = document.getElementById('who');
  if (who) who.onclick = () => { state.who = true; state.whoDate = state.whoDate || today; state.msg = null; render(); window.scrollTo(0, 0); };
  app.querySelectorAll('.cabin').forEach((b) => (b.onclick = () => { state.cabin = b.dataset.c; state.msg = null; render(); window.scrollTo(0, 0); }));
}

// ---------- supply count (stock check) ----------
function lowList(d, counts) {
  return (d.stock || []).filter((i) => typeof counts[i.id] === 'number' && counts[i.id] <= (i.lowAt || 0))
    .map((i) => esc(i.name) + ' ' + counts[i.id] + (i.unit ? ' ' + esc(i.unit) : ''));
}
function stockBoxHtml(d) {
  const items = d.stock || [];
  if (!items.length) return '';
  const last = d.stockLast;
  const lastTxt = last ? 'Last counted ' + timeText(last.at) + ' by ' + esc(last.staff) : 'Not counted yet';
  const low = last ? lowList(d, last.counts || {}) : [];
  return `<div class="stockbox${d.stockDue ? '' : ' ok'}" role="status">
    <b>${d.stockDue ? '📦 Stock check due' : '📦 Supplies'}</b>
    <span class="small">${lastTxt}${low.length ? ' · <span class="low">Low: ' + low.join(', ') + '</span>' : last ? ' · nothing low' : ''}</span>
    ${d.stockDue ? '<span class="small">After you finish cleaning, count the supplies so the owner knows what to buy.</span>' : ''}
    <button class="btn ${d.stockDue ? 'primary' : 'secondary'}" id="stockgo">${d.stockDue ? 'Count the supplies' : 'Count again'}</button>
  </div>`;
}
function openStock() { state.stock = true; state.counts = {}; state.stockNote = ''; state.msg = null; render(); window.scrollTo(0, 0); }

function renderStock() {
  const d = state.data;
  const items = d.stock || [];
  const filled = items.filter((i) => state.counts[i.id] !== undefined && state.counts[i.id] !== '').length;
  const all = items.length > 0 && filled === items.length;
  app.innerHTML = `
    <div class="top">
      <div><p class="eyebrow">${esc(state.me)} · supply count</p><h1>Stock check</h1></div>
      <button class="backbtn" id="back" aria-label="Back to cabins">‹ Back</button>
    </div>
    ${msgHtml()}
    <p class="small muted">Count what's in the supply room now. Type the number or use − / +. "About" is the app's estimate — if yours is very different, count again.</p>
    <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${items.length}" aria-valuenow="${filled}"><div style="width:${items.length ? (filled / items.length) * 100 : 0}%"></div></div>
    <p class="small muted">${filled} of ${items.length} counted</p>
    <div class="list">${items.map((i) => {
      const v = state.counts[i.id];
      const has = v !== undefined && v !== '';
      const isLow = has && Number(v) <= (i.lowAt || 0);
      return `<div class="sitem${has ? ' done' : ''}">
        <div class="nm"><b>${esc(i.name)}</b><span class="small muted">${i.unit ? esc(i.unit) + ' · ' : ''}${i.expected !== null && i.expected !== undefined ? 'about ' + i.expected + ' left' : 'first count'}${isLow ? ' · <span class="low">LOW</span>' : ''}</span></div>
        <button class="step" data-id="${esc(i.id)}" data-d="-1" aria-label="One less ${esc(i.name)}">−</button>
        <input class="qty" data-id="${esc(i.id)}" type="number" inputmode="numeric" min="0" step="1" value="${has ? esc(v) : ''}" placeholder="?" aria-label="${esc(i.name)} count">
        <button class="step" data-id="${esc(i.id)}" data-d="1" aria-label="One more ${esc(i.name)}">+</button>
      </div>`;
    }).join('')}</div>
    <label for="snote" class="small muted">Note for the owner (optional) — e.g. what to buy</label>
    <textarea id="snote" placeholder="Optional">${esc(state.stockNote)}</textarea>
    <div class="sticky">
      <button class="btn primary" id="ssend" ${!all || state.busy ? 'disabled' : ''}>${state.busy ? 'Sending…' : all ? 'Submit count' : 'Count every item first (' + (items.length - filled) + ' left)'}</button>
    </div>`;
  document.getElementById('back').onclick = goBack;
  document.getElementById('snote').oninput = (e) => { state.stockNote = e.target.value; };
  const keep = (fn) => { const y = window.scrollY; fn(); renderStock(); window.scrollTo(0, y); };
  app.querySelectorAll('.step').forEach((b) => (b.onclick = () => keep(() => {
    const id = b.dataset.id; const cur = state.counts[id];
    const base = cur === undefined || cur === '' ? (items.find((i) => i.id === id) || {}).expected || 0 : Number(cur);
    state.counts[id] = String(Math.max(0, base + Number(b.dataset.d)));
  })));
  app.querySelectorAll('.qty').forEach((inp) => {
    inp.onchange = () => keep(() => { const n = inp.value.trim(); state.counts[inp.dataset.id] = n === '' ? '' : String(Math.max(0, Math.round(Number(n)) || 0)); });
  });
  document.getElementById('ssend').onclick = () => sendStock();
}

async function sendStock() {
  const counts = {};
  for (const [k, v] of Object.entries(state.counts)) if (v !== '' && v !== undefined) counts[k] = Number(v);
  state.busy = true; state.msg = null; render();
  try {
    const r = await rpc('staff_stock', { p_pin: state.pin, p_counts: counts, p_note: state.stockNote });
    if (r.error) state.msg = { kind: 'error', text: r.error };
    else {
      const low = lowList(state.data, counts);
      state.stock = false; state.counts = {}; state.stockNote = '';
      await refresh();
      state.msg = { kind: 'ok', text: 'Supply count sent · ' + timeText(r.at) + (low.length ? '. Low: ' + low.join(', ').replace(/<[^>]+>/g, '') : '. Nothing low.') };
    }
  } catch (e) { state.msg = { kind: 'error', text: e.message }; }
  state.busy = false; render();
}

function renderWho() {
  const d = state.data;
  const today = todayIso();
  const stays = (d.upcoming || []).filter((b) => b && b.s);
  const cabins = d.cabins || [];
  if (!state.whoDate || state.whoDate < today) state.whoDate = today;
  const sel = state.whoDate;
  const busy = (iso) => stays.some((b) => b.checkIn === iso || b.checkOut === iso) || visitsOn(d, iso).length > 0;
  const days = [];
  for (let i = 0; i <= 30; i++) days.push(addDaysIso(today, i));
  const chip = (iso, i) => {
    const dt = new Date(iso + 'T00:00:00');
    const top = i === 0 ? 'Today' : i === 1 ? 'Tmrw' : dt.toLocaleDateString('en-PH', { weekday: 'short' });
    return '<button data-day="' + iso + '" class="' + (iso === sel ? 'on' : '') + '" aria-pressed="' + (iso === sel) + '" aria-label="' + esc(dt.toLocaleDateString('en-PH', { weekday: 'long', month: 'long', day: 'numeric' })) + '">' +
      (busy(iso) ? '<i aria-hidden="true"></i>' : '') + '<span>' + top + '</span><b>' + dt.getDate() + '</b><span>' + dt.toLocaleDateString('en-PH', { month: 'short' }) + '</span></button>';
  };
  let ins = 0, outs = 0, pax = 0;
  const cards = cabins.map((c, i) => {
    const mine = stays.filter((b) => (b.cabins || []).includes(c));
    const out = mine.filter((b) => b.checkOut === sel);
    const stay = mine.filter((b) => b.checkIn <= sel && sel < b.checkOut);
    const evs = [];
    const who = (b) => '<span class="g">' + (b.guest ? esc(b.guest) : 'Guest') + '</span><span class="small muted">' +
      [paxText(Number(b.guests) || 0), (b.cabins || []).length > 1 ? esc(b.cabins.join(' + ')) + ' booking' : ''].filter(Boolean).join(' · ') + '</span>';
    out.forEach((b) => { outs++; evs.push('<div class="ev"><span class="k out">Check-out 12:00 NN</span>' + who(b) + '</div>'); });
    stay.forEach((b) => {
      const n = Math.round((new Date(sel + 'T00:00:00') - new Date(b.checkIn + 'T00:00:00')) / 86400000) + 1;
      if (b.checkIn === sel) { ins++; pax += Number(b.guests) || 0; evs.push('<div class="ev"><span class="k in">Check-in 4:00 PM</span>' + who(b) + '<span class="small muted">' + b.nights + ' night' + (b.nights === 1 ? '' : 's') + ' · out ' + esc(new Date(b.checkOut + 'T00:00:00').toLocaleDateString('en-PH', { weekday: 'short', month: 'short', day: 'numeric' })) + '</span></div>'); }
      else { pax += Number(b.guests) || 0; evs.push('<div class="ev"><span class="k stay">Staying · night ' + n + ' of ' + b.nights + '</span>' + who(b) + '</div>'); }
    });
    return '<div class="wcab" style="border-left-color:' + COLORS[i % COLORS.length] + '"><div class="cn">' + esc(c) + '</div>' +
      (evs.length ? evs.join('') : '<div class="free">No guests — free tonight</div>') + '</div>';
  }).join('');
  const label = new Date(sel + 'T00:00:00').toLocaleDateString('en-PH', { weekday: 'long', month: 'long', day: 'numeric' });
  const sum = [ins ? ins + ' check-in' + (ins === 1 ? '' : 's') : '', outs ? outs + ' check-out' + (outs === 1 ? '' : 's') : '', pax ? pax + ' guests tonight' : ''].filter(Boolean).join(' · ') || 'No guests';
  app.innerHTML = `
    <div class="top">
      <div><p class="eyebrow">Who's coming</p><h1>${sel === today ? 'Today' : sel === addDaysIso(today, 1) ? 'Tomorrow' : esc(new Date(sel + 'T00:00:00').toLocaleDateString('en-PH', { weekday: 'short', month: 'short', day: 'numeric' }))}</h1></div>
      <button class="backbtn" id="back" aria-label="Back to cabins">‹ Back</button>
    </div>
    <div class="days" id="days" role="group" aria-label="Pick a day">${days.map(chip).join('')}</div>
    <p class="sum">${esc(label)}<br><span class="small muted" style="font-weight:600">${sum}${visitsOn(d, sel).length ? ' · ' + visitsOn(d, sel).length + ' ocular visit' + (visitsOn(d, sel).length === 1 ? '' : 's') : ''}</span></p>
    ${ocularHtml(visitsOn(d, sel), 'Ocular visits')}
    <div class="cabins">${cards}</div>
    <p class="small muted">A dot on a day means guests check in or out, or someone comes to see the place. Check-in 4:00 PM · Check-out 12:00 NN.</p>
    <button class="btn secondary" id="ref">Refresh</button>`;
  document.getElementById('back').onclick = goBack;
  document.getElementById('ref').onclick = () => refresh();
  const strip = document.getElementById('days');
  strip.querySelectorAll('button').forEach((b) => (b.onclick = () => { const x = strip.scrollLeft; state.whoDate = b.dataset.day; render(); document.getElementById('days').scrollLeft = x; }));
  const on = strip.querySelector('.on');
  if (on && strip.scrollLeft === 0) on.scrollIntoView({ block: 'nearest', inline: 'center' });
}

function renderChecklist() {
  const c = state.cabin;
  const list = state.data.checklist || [];
  const t = state.ticks[c] || (state.ticks[c] = {});
  const n = list.filter((_, i) => t[i]).length;
  const all = list.length > 0 && n === list.length;
  app.innerHTML = `
    <div class="top">
      <div><p class="eyebrow">${esc(state.me)}'s checklist</p><h1>${esc(c)}</h1></div>
      <button class="backbtn" id="back" aria-label="Back to cabins">‹ Back</button>
    </div>
    ${msgHtml()}
    <div>
      <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${list.length}" aria-valuenow="${n}"><div style="width:${list.length ? (n / list.length) * 100 : 0}%"></div></div>
      <p class="small muted" style="margin-top:6px">${n} of ${list.length} done${all ? ' — you can mark it Ready' : ''}</p>
    </div>
    <div class="list">
      ${list.map((item, i) => `<label class="item ${t[i] ? 'done' : ''}"><input type="checkbox" data-i="${i}" ${t[i] ? 'checked' : ''}><span>${esc(item)}</span></label>`).join('')}
    </div>
    <label for="note" class="small muted">Note for the owner (optional) — e.g. something broken, supplies running low</label>
    <textarea id="note" placeholder="Optional">${esc(state.note)}</textarea>
    <div class="sticky">
      <button class="btn secondary" id="start" ${state.busy ? 'disabled' : ''}>I'm starting to clean</button>
      <button class="btn primary" id="ready" ${!all || state.busy ? 'disabled' : ''}>${all ? '✓ Ready — my part is done' : list.length ? 'Ready (tick all ' + list.length + ' first)' : 'No checklist yet — ask the owner'}</button>
    </div>`;
  document.getElementById('back').onclick = goBack;
  document.getElementById('note').oninput = (e) => { state.note = e.target.value; };
  app.querySelectorAll('input[type=checkbox]').forEach((cb) => (cb.onchange = () => {
    t[cb.dataset.i] = cb.checked; save();
    const y = window.scrollY; renderChecklist(); window.scrollTo(0, y);
  }));
  document.getElementById('start').onclick = () => mark('cleaning');
  document.getElementById('ready').onclick = () => mark('ready');
}

function renderDone() {
  const d = state.done;
  app.innerHTML = `
    <div class="card" style="text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;padding:28px 16px">
      <div class="big-check" aria-hidden="true">✅</div>
      <h2>${d.waiting && d.waiting.length ? 'Your part of ' + esc(d.cabin) + ' is done' : esc(d.cabin) + ' is Ready'}</h2>
      <p class="muted">Recorded for ${esc(d.name)} · ${timeText(d.at)}</p>
      <p class="small muted">${d.waiting && d.waiting.length ? esc(d.cabin) + ' becomes fully Ready when ' + esc(d.waiting.join(' and ')) + ' finish' + (d.waiting.length === 1 ? 'es' : '') + ' too.' : 'Everyone is done — ' + esc(d.cabin) + ' is fully Ready.'} The owner's CBTG app will show it shortly. Thank you!</p>
    </div>
    ${(state.data && (state.data.stock || []).length) ? '<button class="btn primary" id="cnt">📦 Count the supplies now</button>' : ''}
    <button class="btn ${(state.data && (state.data.stock || []).length) ? 'secondary' : 'primary'}" id="ok">Back to cabins</button>`;
  document.getElementById('ok').onclick = goBack;
  const cnt = document.getElementById('cnt');
  if (cnt) cnt.onclick = () => { state.done = null; openStock(); };
}

load();
if (state.pin) login(state.pin); else render();
</script>
</body>
</html>
