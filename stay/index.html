/* ------------------------------------------------------------------ load */
async function load() {
  if (!/^[A-Za-z0-9_-]{16,64}$/.test(token)) return fail('This link looks incomplete.', 'Pakicheck po ang link na pinadala namin, o i-message kami para sa bago.');
  try {
    const r = await rpc('stay_get', { p_token: token });
    if (r.error === 'missing') return fail('Guest page not found', 'Baka po na-update ang booking niyo. I-message lang kami para sa bagong link.');
    if (r.error === 'closed') return fail('Salamat po sa pag-stay!', 'Closed na po ang guest page na ito. Sana makabalik kayo sa CBTG! 🌿');
    if (r.error) throw new Error(r.error);
    S = r; render();
  } catch (e) {
    fail('Walang internet?', 'Hindi ma-load ang guest page. Pakisubukan ulit mamaya.', true);
  }
}
function fail(title, text, retry) {
  $('#tabs').hidden = true;
  $('#app').innerHTML = `<div class="center"><div class="brand"><div class="mark">${svg('cabin', 20, '#7A5C17', 1.6)}</div></div>
    <h1 style="font-size:24px">${esc(title)}</h1><p class="msg">${esc(text)}</p>
    ${retry ? '<button class="btn" onclick="load()">Try again</button>' : ''}
    <a class="btn light" href="${MESSENGER_URL}">Message CBTG</a></div>`;
}

/* ------------------------------------------------------------------ derived */
function stay() { return S.stay || {}; }
function cabins() { const c = (stay().cabins || []).filter((k) => CABINS[k]); return c.length ? c : ['Cabin 1']; }
function cabin() { const list = cabins(); return CABINS[list[Math.min(cabinIdx, list.length - 1)]]; }
function phase() {
  const s = stay(), today = S.today;
  if (today < s.checkIn) return 'before';
  if (today < s.checkOut) return 'during';
  return today === s.checkOut ? 'checkout' : 'after';
}
function countdown() {
  const s = stay(), d = daysBetween(S.today, s.checkIn), p = phase();
  if (p === 'before') return d === 1 ? 'Bukas na!' : `${d} days to go`;
  if (p === 'during') return 'Enjoy your stay';
  if (p === 'checkout') return 'Check-out today';
  return 'Thank you!';
}

/* ------------------------------------------------------------------ render */
function render() {
  const tabsEl = $('#tabs'); tabsEl.hidden = false;
  const T = [['home', 'Home'], ['cabin', 'Cabin'], ['ikot', 'Ikot'], ['chat', 'Chat'], ['album', 'Album']];
  tabsEl.firstElementChild.innerHTML = T.map(([k, l]) =>
    `<button class="${tab === k ? 'on' : ''}" onclick="go('${k}')" ${tab === k ? 'aria-current="page"' : ''}>${svg(k === 'home' ? 'home' : k, 22)}${l}</button>`).join('');
  const html = view ? VIEWS[view]() : TABS[tab]();
  $('#app').innerHTML = html;
  window.scrollTo(0, 0);
}
function getRead() { try { return localStorage.getItem('rules-' + token); } catch { return null; } }
function setRead() { try { localStorage.setItem('rules-' + token, '1'); } catch {} }
function go(t) { tab = t; view = null; render(); }
function show(v) { view = v; render(); }
function topBar(title, backTo) {
  return `<div class="top"><button class="back" aria-label="Back" onclick="${backTo ? `show('${backTo}')` : 'show(null)'}">${svg('back', 18, 'currentColor', 2)}</button><h1>${esc(title)}</h1></div>`;
}

/* ------------------------------------------------------------------ uploads */
async function pick(fileList) {
  up.err = '';
  for (const file of Array.from(fileList || [])) {
    if (up.files.length >= 20) { up.err = 'Hanggang 20 items po per upload.'; break; }
    const kind = file.type.startsWith('video/') ? 'video' : file.type.startsWith('image/') ? 'photo' : null;
    if (!kind) continue;
    const item = { file, kind, thumb: null, sec: 0 };
    if (kind === 'video') {
      const meta = await videoMeta(file);
      if (meta.sec > VIDEO_MAX_SEC + 2) { up.err = `Hanggang ${VIDEO_MAX_SEC} seconds lang po ang video (${file.name || 'video'} ay ${Math.round(meta.sec)}s).`; continue; }
      if (file.size > MAX_MB * 1048576) { up.err = `Masyadong malaki ang video (max ${MAX_MB}MB).`; continue; }
      item.sec = meta.sec; item.thumb = meta.thumb;
    } else {
      item.thumb = URL.createObjectURL(file);
    }
    up.files.push(item);
  }
  render();
}
function videoMeta(file) {
  return new Promise((res) => {
    const v = document.createElement('video'); v.preload = 'metadata'; v.muted = true; v.playsInline = true;
    const url = URL.createObjectURL(file); let done = false;
    const finish = (thumb) => { if (done) return; done = true; res({ sec: isFinite(v.duration) ? v.duration : 0, thumb }); };
    v.onloadeddata = () => { try { const c = document.createElement('canvas'); c.width = 240; c.height = 240 * (v.videoHeight / v.videoWidth || 1); c.getContext('2d').drawImage(v, 0, 0, c.width, c.height); finish(c.toDataURL('image/jpeg', 0.7)); } catch { finish(null); } };
    v.onloadedmetadata = () => { v.currentTime = Math.min(0.5, (v.duration || 1) / 2); };
    v.onerror = () => finish(null); setTimeout(() => finish(null), 6000);
    v.src = url;
  });
}
function shrinkPhoto(file) {
  return new Promise((res) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 2000, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob((b) => res(b && b.size < file.size ? { blob: b, type: 'image/jpeg', ext: 'jpg' } : { blob: file, type: file.type, ext: extOf(file) }), 'image/jpeg', 0.86);
    };
    img.onerror = () => res({ blob: file, type: file.type, ext: extOf(file) });
    img.src = url;
  });
}
function extOf(f) { const m = /\.([a-z0-9]{2,5})$/i.exec(f.name || ''); return (m ? m[1] : (f.type.split('/')[1] || 'bin')).toLowerCase().replace('quicktime', 'mov').replace('jpeg', 'jpg'); }
async function uploadAll() {
  if (!up.files.length || up.busy) return;
  up.busy = true; up.done = 0; up.err = ''; render();
  try {
    for (const it of up.files) {
      const body = it.kind === 'photo' ? await shrinkPhoto(it.file) : { blob: it.file, type: it.file.type || 'video/mp4', ext: extOf(it.file) };
      if (body.blob.size > MAX_MB * 1048576) throw new Error(`Masyadong malaki ang isang file (max ${MAX_MB}MB).`);
      const path = `${token}/${randId()}.${body.ext}`;
      const r = await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path}`, { method: 'POST', headers: Object.assign(headers(false), { 'Content-Type': body.type, 'x-upsert': 'false' }), body: body.blob });
      if (!r.ok) throw new Error('Hindi na-upload ang isang file. Pakisubukan ulit.');
      const a = await rpc('stay_media_add', { p_token: token, p_path: path, p_kind: it.kind, p_consent: up.consent, p_caption: up.caption });
      if (a.error) throw new Error(a.error);
      up.done++; render();
    }
    up = { files: [], consent: up.consent, caption: '', busy: false, done: 0, err: '' };
    const r = await rpc('stay_get', { p_token: token }); if (!r.error) S = r;
    toast('Salamat po! Na-upload na.'); go('album');
  } catch (e) {
    up.busy = false; up.err = e.message || 'Hindi na-upload. Pakisubukan ulit.'; render();
  }
}

load();
