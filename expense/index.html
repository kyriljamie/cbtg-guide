<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2F5D3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CBTG Expenses">
<title>CBTG Disbursements</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#F5F2EA; --surface:#FFFDF8; --fg:#1E2A21; --muted:#5E6A5F; --line:#DCD6C6;
  --forest:#2F5D3A; --forest-ink:#FFFFFF; --gold:#9A7428; --gold-soft:#F1E6CB; --chip:#E8EFE6;
  --ok:#2E6B3F; --ok-soft:#DDEFE1; --warn:#8A5A00; --warn-soft:#FBEFD5; --bad:#B3261E; --bad-soft:#F7E1DE;
  --display:'DM Serif Display', Georgia, 'Times New Roman', serif;
  --body:'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111511; --surface:#1A201B; --fg:#ECE7DA; --muted:#A6AD9F; --line:#2E362F;
  --forest:#8FC09A; --forest-ink:#10170F; --gold:#D8B566; --gold-soft:#2C2719; --chip:#223024;
  --ok:#8FC09A; --ok-soft:#1E2D21; --warn:#D8B566; --warn-soft:#2C2719; --bad:#F2A49B; --bad-soft:#3A1F1C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111511; --surface:#1A201B; --fg:#ECE7DA; --muted:#A6AD9F; --line:#2E362F;
  --forest:#8FC09A; --forest-ink:#10170F; --gold:#D8B566; --gold-soft:#2C2719; --chip:#223024;
  --ok:#8FC09A; --ok-soft:#1E2D21; --warn:#D8B566; --warn-soft:#2C2719; --bad:#F2A49B; --bad-soft:#3A1F1C; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px calc(40px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:18px;min-height:100dvh}
h1,h2{font-family:var(--display);font-weight:400;margin:0;line-height:1.1}
h1{font-size:2rem}
h2{font-size:1.3rem}
p{margin:0}
.eyebrow{font-size:.72rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.link{background:none;border:0;color:var(--forest);font:inherit;font-weight:700;padding:8px 0;cursor:pointer;min-height:44px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px}
form.card{display:flex;flex-direction:column;gap:16px}
button.btn{font:inherit;font-weight:800;font-size:1.05rem;border-radius:14px;border:0;min-height:56px;padding:0 18px;width:100%;cursor:pointer}
.btn.primary{background:var(--forest);color:var(--forest-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.pin{font:inherit;font-size:2rem;letter-spacing:.5em;text-align:center;width:100%;min-height:64px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--fg)}
.error{background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:12px 14px;font-weight:700}
.notice{background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:12px 14px;font-weight:700}
.f{display:flex;flex-direction:column;gap:6px}
.f > label,.f > .lab{font-size:.8rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.f .lab em{font-style:normal;color:var(--bad);text-transform:none;letter-spacing:0;font-weight:700}
input.t,textarea.t{font:inherit;font-size:16px;width:100%;min-height:50px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--fg);padding:10px 12px}
textarea.t{min-height:70px;resize:vertical}
input.t:focus,textarea.t:focus,.pin:focus{outline:2px solid var(--gold);outline-offset:1px}
.amt{position:relative}
.amt span{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-weight:800;font-size:1.5rem;color:var(--muted)}
.amt input{font-size:1.8rem;font-weight:800;padding-left:40px;min-height:64px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{font:inherit;font-weight:700;font-size:.95rem;min-height:44px;padding:0 14px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.chips button.on{background:var(--forest);border-color:var(--forest);color:var(--forest-ink)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
.row2 .chips{gap:6px}
.row2 .chips button{padding:0 12px}
.row2 .chips{flex-wrap:nowrap}
.recent h2{margin-bottom:6px}
.recent ul{list-style:none;margin:0;padding:0}
.recent li{display:flex;gap:12px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line)}
.recent li:first-child{border-top:0}
.recent .w{flex:1;min-width:0}
.recent .a{font-weight:800;white-space:nowrap}
.unpaid{color:var(--warn);font-weight:800}
.backbtn{flex:none;font:inherit;font-weight:800;font-size:1rem;color:var(--forest);background:var(--surface);border:2px solid var(--forest);border-radius:999px;min-height:44px;padding:0 16px;cursor:pointer}
.btn.secondary{background:var(--surface);color:var(--forest);border:2px solid var(--forest)}
.stockbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;border-radius:14px;border:2px solid var(--forest);background:var(--surface);color:var(--forest);font:inherit;font-weight:800;font-size:1.05rem;cursor:pointer}
.stockbtn.low{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.badge{font-size:.8rem;font-weight:800;border-radius:999px;padding:2px 10px;background:var(--bad);color:#fff}
.items{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:inherit;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px 16px;min-height:64px;cursor:pointer}
.item .n{font-weight:800;font-size:1.05rem}
.item .q{margin-left:auto;text-align:right;font-weight:800;white-space:nowrap}
.item.low{border-color:var(--bad);background:var(--bad-soft)}
.item.low .q{color:var(--bad)}
.item .tag{display:inline-block;font-size:.72rem;font-weight:800;border-radius:999px;padding:2px 8px;background:var(--bad);color:#fff;margin-left:6px;vertical-align:middle}
.item .go{font-size:.8rem;font-weight:800;color:var(--forest)}
.qty{display:flex;align-items:center;gap:10px}
.qty button{font:inherit;font-weight:800;font-size:1.6rem;width:56px;height:56px;border-radius:14px;border:2px solid var(--forest);background:var(--surface);color:var(--forest);cursor:pointer}
.qty input{text-align:center;font-size:1.6rem;font-weight:800;min-height:56px}
.buyhead{background:var(--bad-soft);border-color:var(--bad)}
.seg{display:flex;border:2px solid #5A4AA8;border-radius:14px;overflow:hidden}
.seg button{flex:1;font:inherit;font-weight:800;font-size:1rem;min-height:50px;border:0;background:var(--surface);color:#5A4AA8;cursor:pointer}
.seg button.on{background:#5A4AA8;color:#fff}
.seg.small button{min-height:44px;font-size:.95rem}
.acctbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;border-radius:14px;border:2px solid var(--forest);background:var(--surface);color:var(--forest);font:inherit;font-weight:800;font-size:1.05rem;cursor:pointer}
.acctbtn small{color:var(--muted);font-weight:700}
.boxes{display:flex;flex-direction:column;gap:10px}
.abox{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px}
.abox .t{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.abox .n{font-weight:800}.abox .v{font-weight:800;font-size:1.35rem;white-space:nowrap}
.abox .r{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-size:.8rem;color:var(--muted);margin-top:4px}
.abox.tot{background:#DDF1EA;border-color:#13866A}
.abox.adv{background:#ECE7F6;border-color:#5A4AA8}
.abox.assets{border-style:dashed}
.g{color:var(--ok)}.red{color:var(--bad)}
.tiles3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile3{font:inherit;color:inherit;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 6px;min-height:72px;cursor:pointer;text-align:center}
.tile3 .n{font-size:.78rem;font-weight:700;color:var(--muted)}.tile3 .v{font-weight:800;font-size:1rem;margin-top:2px;white-space:nowrap}
.tile3.on{border:3px solid var(--forest);background:var(--ok-soft)}.tile3.on .n{color:var(--forest)}
.tile3:disabled{opacity:.35;cursor:not-allowed}
.arrow{text-align:center;font-size:1.4rem;color:var(--forest)}
.preview{border:2px dashed var(--forest);border-radius:12px;padding:10px 12px;background:var(--ok-soft)}
.preview .rw{display:flex;justify-content:space-between;font-size:.92rem;padding:2px 0}
.pend{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:.88rem;font-weight:700}
.buyhead.ok{background:var(--ok-soft);border-color:var(--ok)}
/* Bookings & money overview (view only) */
.ovbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;border-radius:14px;border:2px solid #1F5F8B;background:var(--surface);color:#1F5F8B;font:inherit;font-weight:800;font-size:1.05rem;cursor:pointer}
.ovbtn small{color:var(--muted);font-weight:700}
.tiles2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 12px}
.tile .n{font-size:.75rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tile .v{font-weight:800;font-size:1.25rem;white-space:nowrap}
.tile.green{border-color:#2E6B3F}.tile.green .v{color:var(--ok)}
.tile.red{border-color:var(--bad)}.tile.red .v{color:var(--bad)}
.tile.blue{border-color:#1F5F8B}
.bar{height:12px;border-radius:999px;background:var(--chip);overflow:hidden;margin:8px 0 4px}
.bar span{display:block;height:100%;background:var(--forest);border-radius:999px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list .w{flex:1;min-width:0}
.list .a{font-weight:800;white-space:nowrap;text-align:right}
.pill{display:inline-block;font-size:.72rem;font-weight:800;border-radius:999px;padding:1px 8px;margin-left:4px;vertical-align:middle}
.pill.late{background:var(--bad);color:#fff}.pill.inq{background:var(--gold-soft);color:var(--gold)}.pill.now{background:var(--ok-soft);color:var(--ok)}
.dayhead{font-size:.78rem;font-weight:800;color:var(--gold);text-transform:uppercase;letter-spacing:.08em;padding-top:12px}
.sec h2{margin-bottom:6px}
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"></main>
<script>
// CBTG web expense form. Talks only to the CBTG Supabase functions (expense_login /
// expense_add), which check the PIN and every field on the server. The CBTG app
// pulls new expenses in within a minute.
const API = 'https://fnebydfckdqgigtfhjfk.supabase.co/rest/v1/rpc/';
const KEY = 'sb_publishable_PLLPO77LyLTlHHQr1yF23Q_Y27vUAO1';
const STORE = 'cbtg-expense-v1';

const manilaToday = () => new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10);
const blank = () => ({ date: manilaToday(), amount: '', category: null, payee: '', cabin: null, method: 'Cash', status: 'Paid', notes: '' });
const blankAdv = () => ({ kind: 'advance', owner: null, amount: '', date: manilaToday(), account: 'BDO', note: '' });
const blankTr = () => ({ from: 'Cash', to: 'BDO', amount: '', fee: '', date: manilaToday(), note: '' });
const state = { pin: null, data: null, form: blank(), msg: null, busy: false, view: 'form', buy: null, mode: 'expense', adv: blankAdv(), period: 'today', tr: blankTr(), st: null };
const app = document.getElementById('app');

function load() { try { const s = JSON.parse(localStorage.getItem(STORE) || '{}'); state.pin = s.pin || null; if (s.method) state.form.method = s.method; } catch (e) { /* storage blocked */ } }
function save() { try { localStorage.setItem(STORE, JSON.stringify({ pin: state.pin, method: state.form.method })); } catch (e) { /* ignore */ } }
async function rpc(fn, body) {
  const res = await fetch(API + fn, { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!res.ok) throw new Error('No connection to CBTG (' + res.status + '). Check your data / Wi-Fi and try again.');
  return res.json();
}
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const peso = (n) => { n = Number(n); const f = n % 1 ? 2 : 0; return '₱' + n.toLocaleString('en-PH', { minimumFractionDigits: f, maximumFractionDigits: f }); };
const dayText = (iso) => new Date(iso + 'T00:00:00').toLocaleDateString('en-PH', { weekday: 'short', month: 'short', day: 'numeric' });
const whenText = (iso) => new Date(iso).toLocaleString('en-PH', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
const acctName = (m) => (m === 'Cash' ? 'Cash on hand' : m);
const parseAmount = (s) => { const n = Number(String(s).replace(/[₱,\s]/g, '')); return Number.isFinite(n) && n > 0 ? Math.round(n * 100) / 100 : null; };

async function login(pin) {
  state.busy = true; state.msg = null; render();
  try {
    const r = await rpc('expense_login', { p_pin: pin });
    if (r.error) { state.msg = { kind: 'error', text: r.error }; state.pin = null; state.data = null; }
    else { state.pin = pin; state.data = r; if (!(r.methods || []).includes(state.form.method)) state.form.method = (r.methods || ['Cash'])[0]; }
    save();
  } catch (e) { state.msg = { kind: 'error', text: e.message }; }
  state.busy = false; render();
}

function problem() {
  const f = state.form, d = state.data;
  if (!f.date) return 'Pick the date.';
  if (parseAmount(f.amount) === null) return 'Type the amount.';
  if (!f.category) return 'Pick a category.';
  if (state.view === 'buy' && parseAmount(f.qty) === null) return 'Type how many were bought.';
  if (!f.payee.trim() && state.view !== 'buy') return 'Type what it was for or who was paid.';
  if (!f.cabin && (d.perCabin || []).includes(f.category)) return 'Pick the cabin for this ' + f.category + ' expense.';
  return null;
}

// ---- Supplies (Stock button). onHand = the app's estimate + purchases sent after the app last updated.
function stockList() {
  const d = state.data || {};
  const since = d.stockAt ? Date.parse(d.stockAt) : 0;
  const pending = {};
  for (const r of d.recent || []) {
    const st = r.data && r.data.stock;
    if (st && st.itemId && Date.parse(r.at) > since) pending[st.itemId] = (pending[st.itemId] || 0) + Number(st.qty || 0);
  }
  return (d.stock || []).map((i) => {
    const onHand = i.onHand === null || i.onHand === undefined ? null : Number(i.onHand) + (pending[i.id] || 0);
    return { ...i, onHand, low: onHand !== null && onHand <= Number(i.lowAt || 0) };
  }).sort((a, b) => (b.low - a.low) || String(a.name).localeCompare(String(b.name)));
}
const unitText = (i) => (i.unit ? ' ' + esc(i.unit) : '');
const supplyCategory = () => ((state.data && state.data.categories) || []).find((c) => /suppl|consum|toiletr|amenit/i.test(c)) || null;

// Back navigation: Stock and Buy screens add a history step so the phone's Back returns here.
function show(view, buy) {
  state.view = view; state.buy = buy || null; state.msg = null;
  if (view === 'buy') {
    state.form = { ...blank(), date: state.form.date || manilaToday(), method: state.form.method, category: supplyCategory(), qty: '' };
  } else if (view === 'form') {
    state.form = { ...blank(), date: state.form.date, method: state.form.method };
  } else if (view === 'transfer') {
    state.tr = blankTr();
  } else if (view === 'start') {
    const a = (state.data && state.data.accounts) || {};
    const keys = [...((state.data && state.data.methods) || []), ...((state.data && state.data.owners) || []).map((o) => 'Adv:' + o)];
    state.st = { date: a.asOf || manilaToday(), vals: Object.fromEntries(keys.map((k) => [k, a.start && a.start[k] !== undefined ? String(a.start[k]) : ''])) };
  }
  if (view !== 'form' && !(history.state && history.state.cbtgView === view)) history.pushState({ cbtgView: view }, '');
  render(); window.scrollTo(0, 0);
}
function goBack() { if (history.state && history.state.cbtgView) history.back(); else show('form'); }
window.addEventListener('popstate', () => {
  const v = (history.state && history.state.cbtgView) || 'form';
  if (v === state.view) return;
  state.view = v === 'buy' && !state.buy ? 'stock' : v === 'start' && !state.st ? 'accounts' : v; state.msg = null;
  if (state.view !== 'buy') state.buy = null;
  if (state.view === 'form') state.form = { ...blank(), date: state.form.date, method: state.form.method };
  render(); window.scrollTo(0, 0);
});

async function send() {
  const bad = problem();
  if (bad) { state.msg = { kind: 'error', text: bad }; render(); return; }
  const f = state.form;
  const item = state.view === 'buy' ? state.buy : null;
  const qty = item ? parseAmount(f.qty) : null;
  if (item && qty === null) { state.msg = { kind: 'error', text: 'Type how many ' + (item.unit || '') + ' were bought.' }; render(); return; }
  const data = { date: f.date, amount: parseAmount(f.amount), category: f.category, payee: f.payee.trim() || (item ? item.name : ''), cabin: f.cabin, method: f.method, status: f.status,
    notes: [item ? 'Bought ' + qty + (item.unit ? ' ' + item.unit : '') + ' ' + item.name : '', f.notes.trim()].filter(Boolean).join(' · ') || null,
    ...(item ? { stock: { itemId: item.id, qty } } : {}) };
  state.busy = true; state.msg = null; render();
  try {
    const r = await rpc('expense_add', { p_pin: state.pin, p_data: data });
    if (r.error) { state.msg = { kind: 'error', text: r.error }; if (r.error === 'Wrong PIN.') { state.pin = null; state.data = null; save(); } }
    else {
      const fresh = await rpc('expense_login', { p_pin: state.pin }).catch(() => null);
      if (fresh && !fresh.error) state.data = fresh;
      if (item) {
        state.view = 'stock'; state.buy = null;
        if (history.state && history.state.cbtgView === 'buy') history.back(); // drop the Buy step; Back then goes to the form
        state.msg = { kind: 'notice', text: '✓ Added ' + qty + (item.unit ? ' ' + item.unit : '') + ' ' + item.name + ' · ' + peso(data.amount) + (r.duplicate ? ' (already sent)' : '') + '. Stock and expense update in the CBTG app within a minute.' };
      } else {
        state.msg = { kind: 'notice', text: '✓ Saved ' + peso(data.amount) + ' · ' + data.category + (r.duplicate ? ' (already sent)' : '') + '. It shows in the CBTG app within a minute.' };
      }
      state.form = { ...blank(), date: f.date, method: f.method };
    }
  } catch (e) { state.msg = { kind: 'error', text: e.message + ' Nothing was saved.' }; }
  state.busy = false; render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

const msgHtml = () => state.msg ? `<div class="${state.msg.kind}" role="${state.msg.kind === 'error' ? 'alert' : 'status'}">${esc(state.msg.text)}</div>` : '';

function render() {
  if (!state.data) return renderLogin();
  if (state.view === 'stock') return renderStock();
  if (state.view === 'overview' && state.data.overview) return renderOverview();
  if (state.view === 'accounts' && state.data.accounts) return renderAccounts();
  if (state.view === 'transfer' && state.data.accounts) return renderTransfer();
  if (state.view === 'start' && state.data.accounts && state.st) return renderStart();
  if (state.view === 'form' && state.mode === 'advance') return renderAdvance();
  return renderForm();
}

function renderStock() {
  const list = stockList();
  const low = list.filter((i) => i.low).length;
  app.innerHTML = `
    <div class="top">
      <div><p class="eyebrow">Supplies</p><h1>Stock</h1><p class="muted small">${low ? '<b style="color:var(--bad)">' + low + ' running low</b> · ' : ''}tap an item to buy / add</p></div>
      <button class="backbtn" id="back">‹ Back</button>
    </div>
    ${msgHtml()}
    ${list.length ? `<div class="items">${list.map((i) => `
      <button class="item${i.low ? ' low' : ''}" data-id="${esc(i.id)}">
        <div><div class="n">${esc(i.name)}${i.low ? '<span class="tag">LOW</span>' : ''}</div>
          <div class="small muted">Low at ${esc(i.lowAt)}${unitText(i)} · <span class="go">${i.low ? 'Tap to buy' : 'Buy / add'} ›</span></div></div>
        <div class="q">${i.onHand === null ? '<span class="small muted">not counted</span>' : 'about ' + esc(Math.max(0, Math.round(i.onHand))) + unitText(i)}</div>
      </button>`).join('')}</div>` : '<div class="card muted">No supplies set up yet. Jay can add them in the CBTG app (Cabins & upkeep → Stock).</div>'}

// ---- Shared bits of the main screen: Stock + Accounts buttons, Expense / Advance switch, recent list.
function topButtons() {

  const stock = st.length ? `<button class="stockbtn${n ? ' low' : ''}" id="stock">📦 ${n ? 'Low stocks' : 'Stock'} ${n ? '<span class="badge">' + n + ' low</span>' : '<small class="muted">all OK</small>'}</button>` : '';
  const acc = d.accounts && d.accounts.periods ? `<button class="acctbtn" id="acct">🏦 Money in the accounts <small>${esc(pesoShort(d.accounts.periods.today.total.closing))}</small></button>` : '';
  const ov = d.overview && d.overview.receivables ? `<button class="ovbtn" id="ovw">📊 Bookings &amp; money <small>${esc(pesoShort(d.overview.receivables.total))} to collect</small></button>` : '';
  return ov + stock + acc;
}
function segHtml() {
  return `<div class="seg" role="group" aria-label="What are you adding?"><button type="button" data-mode="expense" class="${state.mode === 'expense' ? 'on' : ''}">Expense</button><button type="button" data-mode="advance" class="${state.mode === 'advance' ? 'on' : ''}">Advance to owner</button></div>`;
}
function wireTop() {
  const sb = document.getElementById('stock'); if (sb) sb.onclick = () => show('stock');
  const ab = document.getElementById('acct'); if (ab) ab.onclick = () => show('accounts');
  const ob = document.getElementById('ovw'); if (ob) ob.onclick = () => show('overview');
  app.querySelectorAll('[data-mode]').forEach((b) => b.onclick = () => { state.mode = b.dataset.mode; state.msg = null; render(); });
}
function recentLine(r) {
  const x = r.data || {}, who = ' · by ' + esc(r.by) + ', ' + esc(whenText(r.at));
  if (x.type === 'advance' || x.type === 'repay') return `<li><div class="w"><b>👤 ${esc(x.owner)} ${x.type === 'advance' ? 'took' : 'paid back'}</b><br><span class="small muted">${esc(dayText(x.date))} · ${x.type === 'advance' ? 'from' : 'into'} ${esc(acctName(x.account))}${x.note ? ' · ' + esc(x.note) : ''}${who}</span></div><span class="a">${esc(peso(x.amount))}</span></li>`;
  if (x.type === 'transfer') return `<li><div class="w"><b>⇄ ${esc(acctName(x.from))} → ${esc(acctName(x.to))}</b><br><span class="small muted">${esc(dayText(x.date))}${x.fee ? ' · fee ' + esc(peso(x.fee)) : ''}${x.note ? ' · ' + esc(x.note) : ''}${who}</span></div><span class="a">${esc(peso(x.amount))}</span></li>`;
  if (x.type === 'start') return `<li><div class="w"><b>✎ Starting balances</b><br><span class="small muted">as of ${esc(dayText(x.date))}${who}</span></div><span class="a"></span></li>`;
  return `<li><div class="w"><b>${esc(x.category)}</b> · ${esc(x.payee)}${x.cabin ? ' · ' + esc(x.cabin) : ''}<br>
        <span class="small muted">${esc(dayText(x.date))} · from ${esc(acctName(x.method))}${x.status === 'Unpaid' ? ' · <span class="unpaid">Unpaid</span>' : ''}${who}</span></div>
        <span class="a">${esc(peso(x.amount))}</span></li>`;
}
function recentHtml() {
  const rec = state.data.recent || [];
  return rec.length ? `<section class="card recent"><h2>Sent from the web</h2><ul>${rec.map(recentLine).join('')}</ul>
      <p class="small muted" style="margin-top:8px">Made a mistake? Tell Jay to fix or delete it in the app.</p></section>` : '';
}
const pesoShort = (n) => { const a = Math.abs(n), sg = n < 0 ? '−' : ''; if (a >= 1e6) return sg + '₱' + (a / 1e6).toFixed(2) + 'M'; if (a >= 1e5) return sg + '₱' + Math.round(a / 1e3) + 'K'; return sg + peso(Math.round(a)); };
const pesoS = (n) => (n < 0 ? '−' : '') + peso(Math.round(Math.abs(n)));
// Entries sent from the web that the app hasn't taken in yet.
const pendingMoney = () => { const d = state.data, since = d.stockAt ? Date.parse(d.stockAt) : 0; return (d.recent || []).filter((r) => r.data && ['advance', 'repay', 'transfer', 'start'].includes(r.data.type) && Date.parse(r.at) > since); };

async function sendMoney(payload, okText, after) {
  state.busy = true; state.msg = null; render();
  try {
    const r = await rpc('expense_add', { p_pin: state.pin, p_data: payload });
    if (r.error) { state.msg = { kind: 'error', text: r.error }; if (r.error === 'Wrong PIN.') { state.pin = null; state.data = null; save(); } }
    else {
      const fresh = await rpc('expense_login', { p_pin: state.pin }).catch(() => null);
      if (fresh && !fresh.error) state.data = fresh;
      after();
      state.msg = { kind: 'notice', text: okText + (r.duplicate ? ' (already sent)' : '') + ' It shows in the CBTG app within a minute.' };
    }
  } catch (e) { state.msg = { kind: 'error', text: e.message + ' Nothing was saved.' }; }
  state.busy = false; render(); window.scrollTo({ top: 0, behavior: 'smooth' });
}

    ${topButtons()}${segHtml()}${msgHtml()}
    <form id="af" class="card" novalidate>
      <div class="seg small"><button type="button" data-k="advance" class="${a.kind === 'advance' ? 'on' : ''}">Took money</button><button type="button" data-k="repay" class="${a.kind === 'repay' ? 'on' : ''}">Paid back</button></div>
      <div class="f"><span class="lab">Owner</span><div class="chips">${owners.map((o) => chip('owner', o, o, a.owner === o)).join('')}</div></div>
      <div class="f"><label for="aamt">Amount</label><div class="amt"><span>₱</span><input class="t" id="aamt" inputmode="decimal" autocomplete="off" placeholder="0" value="${esc(a.amount)}"></div></div>
      <div class="f"><label for="adate">Date</label><input class="t" id="adate" type="date" value="${esc(a.date)}"></div>
      <div class="f"><span class="lab">${a.kind === 'advance' ? 'Taken from' : 'Paid back into'}</span><div class="chips">${(d.methods || []).map((m) => chip('account', m, acctName(m), a.account === m)).join('')}</div></div>
      <div class="f"><label for="anote">Purpose / note</label><input class="t" id="anote" autocomplete="off" placeholder="${a.kind === 'advance' ? 'e.g. personal, to return in Nov' : 'Optional'}" value="${esc(a.note)}"></div>
      <button class="btn primary" style="background:#5A4AA8" ${state.busy ? 'disabled' : ''}>${state.busy ? 'Saving…' : a.kind === 'advance' ? '✓ Save advance' : '✓ Save pay-back'}</button>
      <p class="small muted">${a.kind === 'advance' ? 'Comes out of ' + esc(acctName(a.account)) + ' and is owed back by ' + esc(a.owner || 'the owner') + '. Not an expense, so profit doesn\'t change.' : 'Goes back into ' + esc(acctName(a.account)) + ' and lowers what ' + esc(a.owner || 'the owner') + ' owes.'}</p>

  const keep = () => { a.amount = document.getElementById('aamt').value; a.date = document.getElementById('adate').value; a.note = document.getElementById('anote').value; };
  app.querySelectorAll('[data-a]').forEach((b) => b.onclick = () => { keep(); a[b.dataset.a] = b.dataset.v; state.msg = null; render(); });
  app.querySelectorAll('[data-k]').forEach((b) => b.onclick = () => { keep(); a.kind = b.dataset.k; state.msg = null; render(); });
  document.getElementById('af').onsubmit = (e) => {
    e.preventDefault(); keep();
    const amt = parseAmount(a.amount);
    if (!a.owner) { state.msg = { kind: 'error', text: 'Pick the owner.' }; return render(); }
    if (amt === null) { state.msg = { kind: 'error', text: 'Type the amount.' }; return render(); }
    if (!a.date) { state.msg = { kind: 'error', text: 'Pick the date.' }; return render(); }
    sendMoney({ type: a.kind, date: a.date, owner: a.owner, amount: amt, account: a.account, note: a.note.trim() || null },
      '✓ Saved: ' + a.owner + (a.kind === 'advance' ? ' took ' : ' paid back ') + peso(amt) + '.', () => { state.adv = { ...blankAdv(), kind: a.kind, owner: a.owner, account: a.account, date: a.date }; });
  };
  const out = document.getElementById('out');
  if (out) out.onclick = () => { state.pin = null; state.data = null; state.msg = null; save(); render(); };
  wireTop();
}

}

function renderTransfer() {
  const A = state.data.accounts, now = A.periods.today, t = state.tr, methods = state.data.methods || [];
  const bal = (m) => (now.rows.find((r) => r.account === m) || { closing: 0 }).closing;
  const amt = parseAmount(t.amount), fee = t.fee.trim() ? parseAmount(t.fee) : 0;
  const ready = amt !== null && fee !== null;
  const fromAfter = bal(t.from) - (ready ? amt + fee : 0), toAfter = bal(t.to) + (ready ? amt : 0);
  const tiles = (g, picked, disabled) => `<div class="tiles3">${methods.map((m) => `<button type="button" class="tile3${picked === m ? ' on' : ''}" data-t="${g}" data-v="${esc(m)}" ${m === disabled ? 'disabled' : ''} aria-pressed="${picked === m}"><div class="n">${esc(acctName(m))}</div><div class="v${bal(m) < 0 ? ' red' : ''}">${esc(pesoS(bal(m)))}</div></button>`).join('')}</div>`;
  app.innerHTML = `
    <div class="top"><div><p class="eyebrow">Accounts</p><h1>⇄ Transfer</h1></div><button class="backbtn" id="back">‹ Back</button></div>
    ${msgHtml()}
    <form id="tf" class="card" novalidate>
      <div class="f"><span class="lab">From</span>${tiles('from', t.from)}</div>
      <div class="arrow" aria-hidden="true">↓</div>
      <div class="f"><span class="lab">To</span>${tiles('to', t.to, t.from)}</div>
      <div class="f"><label for="tamt">Amount moved</label><div class="amt"><span>₱</span><input class="t" id="tamt" inputmode="decimal" autocomplete="off" placeholder="0" value="${esc(t.amount)}"></div></div>
      <div class="f"><label for="tfee">Fee (optional)</label><input class="t" id="tfee" inputmode="decimal" autocomplete="off" placeholder="0" value="${esc(t.fee)}"><p class="small muted">e.g. GCash cash-out or bank fee. It's taken from the “From” account too.</p></div>
      <div id="tprev">${ready ? previewHtml(t, bal, fromAfter, toAfter) : ''}</div>
      <div class="f"><label for="tdate">Date</label><input class="t" id="tdate" type="date" value="${esc(t.date)}"></div>
      <div class="f"><label for="tnote">Note (optional)</label><input class="t" id="tnote" autocomplete="off" placeholder="e.g. deposited cash at BDO" value="${esc(t.note)}"></div>
      <button class="btn primary" ${state.busy ? 'disabled' : ''}>${state.busy ? 'Saving…' : '✓ Save transfer'}</button>
    </form>
    <p class="small muted">A transfer isn't income or an expense; it only moves money between balances. Balances shown are as of the app's last sync.</p>
    <button class="btn secondary" id="back2">‹ Back to accounts</button>`;
  const keep = () => { t.amount = document.getElementById('tamt').value; t.fee = document.getElementById('tfee').value; t.date = document.getElementById('tdate').value; t.note = document.getElementById('tnote').value; };
  const live = () => { keep(); const a2 = parseAmount(t.amount), f2 = t.fee.trim() ? parseAmount(t.fee) : 0; document.getElementById('tprev').innerHTML = a2 !== null && f2 !== null ? previewHtml(t, bal, bal(t.from) - a2 - f2, bal(t.to) + a2) : ''; };
  document.getElementById('tamt').oninput = live; document.getElementById('tfee').oninput = live;
  app.querySelectorAll('[data-t]').forEach((b) => b.onclick = () => {
    keep(); t[b.dataset.t] = b.dataset.v;
    if (t.from === t.to) t.to = methods.find((m) => m !== t.from) || t.to;
    render();
  });
  document.getElementById('tf').onsubmit = (e) => {
    e.preventDefault(); keep();
    const a2 = parseAmount(t.amount), f2 = t.fee.trim() ? parseAmount(t.fee) : 0;
    if (a2 === null) { state.msg = { kind: 'error', text: 'Type the amount moved.' }; return render(); }
    if (f2 === null) { state.msg = { kind: 'error', text: 'Check the fee.' }; return render(); }
    if (!t.date) { state.msg = { kind: 'error', text: 'Pick the date.' }; return render(); }
    sendMoney({ type: 'transfer', date: t.date, from: t.from, to: t.to, amount: a2, fee: f2 || null, note: t.note.trim() || null },
      '✓ Transfer saved: ' + acctName(t.from) + ' → ' + acctName(t.to) + ' ' + peso(a2) + '.', () => {
        state.view = 'accounts'; state.tr = blankTr();
        if (history.state && history.state.cbtgView === 'transfer') history.back();
      });
  };
  ['back', 'back2'].forEach((id) => document.getElementById(id).onclick = goBack);
}
function previewHtml(t, bal, fromAfter, toAfter) {
  return (fromAfter < 0 ? `<div class="error" style="margin-bottom:10px">${esc(acctName(t.from))} only has ${esc(pesoS(bal(t.from)))}. After this it would be ${esc(pesoS(fromAfter))}. Check the amount (you can still save if the app's balance is behind).</div>` : '') +
    `<div class="preview"><span class="lab" style="font-size:.75rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em">After this transfer</span>
      <div class="rw"><span>${esc(acctName(t.from))}</span><span>${esc(pesoS(bal(t.from)))} → <b class="${fromAfter < 0 ? 'red' : ''}">${esc(pesoS(fromAfter))}</b></span></div>
      <div class="rw"><span>${esc(acctName(t.to))}</span><span>${esc(pesoS(bal(t.to)))} → <b class="g">${esc(pesoS(toAfter))}</b></span></div></div>`;
}

function renderStart() {
  const s2 = state.st, d = state.data, methods = d.methods || [], owners = d.owners || [];
  const field = (k, label) => `<div class="f"><label for="sv-${esc(k)}">${esc(label)}</label><div class="amt"><span>₱</span><input class="t" id="sv-${esc(k)}" data-k="${esc(k)}" inputmode="decimal" autocomplete="off" placeholder="0" value="${esc(s2.vals[k] || '')}"></div></div>`;
  app.innerHTML = `
    <div class="top"><div><p class="eyebrow">Accounts</p><h1>Starting balances</h1></div><button class="backbtn" id="back">‹ Back</button></div>
    ${msgHtml()}
    <form id="sf" class="card" novalidate>
      <p class="small muted">Type what was in each account at the START of this date (check the BDO and GCash apps, count the cash). Everything from that date on is added or taken away automatically.</p>
      <div class="f"><label for="sdate">As of the start of</label><input class="t" id="sdate" type="date" value="${esc(s2.date)}"></div>
      ${methods.map((m) => field(m, acctName(m))).join('')}
      <p class="lab" style="font-size:.8rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:6px">Owners still owe (advances not yet returned)</p>
      ${owners.map((o) => field('Adv:' + o, o)).join('')}
      <button class="btn primary" ${state.busy ? 'disabled' : ''}>${state.busy ? 'Saving…' : '✓ Save balances'}</button>
    </form>
    <div class="notice">Changes show in Jay's app with your name on them.</div>
    <button class="btn secondary" id="back2">‹ Back to accounts</button>`;
  document.getElementById('sf').onsubmit = (e) => {
    e.preventDefault();
    s2.date = document.getElementById('sdate').value;
    const balances = {};
    for (const inp of app.querySelectorAll('[data-k]')) {
      s2.vals[inp.dataset.k] = inp.value;
      const v = inp.value.trim() ? Number(inp.value.replace(/[₱,\s]/g, '')) : 0;
      if (!Number.isFinite(v)) { state.msg = { kind: 'error', text: 'Check the amounts.' }; return render(); }
      balances[inp.dataset.k] = Math.round(v * 100) / 100;
    }
    if (!s2.date) { state.msg = { kind: 'error', text: 'Pick the date.' }; return render(); }
    sendMoney({ type: 'start', date: s2.date, balances }, '✓ Starting balances saved.', () => {
      state.view = 'accounts'; state.st = null;
      if (history.state && history.state.cbtgView === 'start') history.back();
    });
  };
  ['back', 'back2'].forEach((id) => document.getElementById(id).onclick = goBack);
}

// ---- Bookings & money overview (view only). Figures come from Jay's app; nothing can be changed here.
const shortDay = (iso) => new Date(iso + 'T00:00:00').toLocaleDateString('en-PH', { month: 'short', day: 'numeric' });
const cabinsText = (c) => (c || []).join(' + ') || '—';
function monthCard(m, first) {
  const pct = m.target ? Math.min(100, Math.round((m.booked / m.target) * 100)) : null;
  return `<section class="card sec"><p class="eyebrow">${first ? 'This month' : 'Next month'}</p><h2>${esc(m.label)}</h2>
    ${m.target ? `<div class="bar" role="img" aria-label="${pct}% of the target"><span style="width:${pct}%"></span></div>
      <p class="small"><b>${esc(peso(m.booked))}</b> booked of the ${esc(peso(m.target))} target (${pct}%)${m.needed > 0 ? ' · <b>' + esc(peso(m.needed)) + '</b> still needed' + (m.bookingsNeeded ? ', about ' + esc(m.bookingsNeeded) + ' more booking' + (m.bookingsNeeded === 1 ? '' : 's') : '') : ' · 🎉 target reached'}</p>`
      : `<p class="small muted">No target set for this month.</p>`}
    <div class="tiles2" style="margin-top:10px">
      <div class="tile blue"><div class="n">Booked</div><div class="v">${esc(pesoShort(m.booked))}</div><div class="small muted">${esc(m.bookings)} booking${m.bookings === 1 ? '' : 's'} · ${esc(m.cabinNights)} cabin-nights</div></div>
      <div class="tile green"><div class="n">Collected</div><div class="v">${esc(pesoShort(m.collected))}</div><div class="small muted">${esc(pesoShort(m.toCollect))} still to collect</div></div>
      <div class="tile red"><div class="n">Expenses</div><div class="v">${esc(pesoShort(m.spent))}</div><div class="small muted">${m.unpaidBills ? esc(m.unpaidBills) + ' unpaid · ' + esc(pesoShort(m.unpaidBillsTotal)) : 'all paid'}</div></div>
      <div class="tile"><div class="n">Open nights</div><div class="v">${esc(m.openCabinNightsLeft)}</div><div class="small muted">cabin-nights still free${m.lastYear ? ' · last year ' + esc(pesoShort(m.lastYear)) : ''}</div></div>
    </div>
    <p class="small muted" style="margin-top:8px">Booked = room rate + extras of stays checking in this month. Expenses = everything dated this month.</p></section>`;
}
function renderOverview() {
  const O = state.data.overview, R = O.receivables, today = O.today;
  const nowIn = O.upcoming.filter((s) => s.checkIn <= today && s.checkOut > today);
  const coming = O.upcoming.filter((s) => s.checkIn > today);
  const byDay = {};
  for (const s of coming) (byDay[s.checkIn] = byDay[s.checkIn] || []).push(s);
  const stayLine = (s, showDue) => `<li><div class="w"><b>${esc(s.guest)}</b>${s.status === 'Inquiry' ? '<span class="pill inq">inquiry</span>' : ''}
      <br><span class="small muted">#${esc(s.no)} · ${esc(cabinsText(s.cabins))} · ${esc(shortDay(s.checkIn))} → ${esc(shortDay(s.checkOut))} · ${esc(s.nights)} night${s.nights === 1 ? '' : 's'}${s.pax ? ' · ' + esc(s.pax) + ' pax' : ''}</span></div>
      <span class="a">${showDue && s.due > 0 ? '<span class="red">' + esc(peso(s.due)) + '</span><br><span class="small muted">due</span>' : s.status === 'Inquiry' ? '' : s.due > 0 ? '<span class="red">' + esc(peso(s.due)) + '</span><br><span class="small muted">due</span>' : '<span class="g small">✓ paid</span>'}</span></li>`;
  app.innerHTML = `
    <div class="top"><div><p class="eyebrow">View only</p><h1>Bookings &amp; money</h1><p class="small muted">From Jay's app${state.data.stockAt ? ', updated ' + esc(whenText(state.data.stockAt)) : ''}</p></div><button class="backbtn" id="back">‹ Back</button></div>
    <div class="tiles2">
      <div class="tile red"><div class="n">Still to collect</div><div class="v">${esc(pesoShort(R.total))}</div><div class="small muted">${esc(R.count)} booking${R.count === 1 ? '' : 's'}</div></div>
      <div class="tile${R.overdue ? ' red' : ''}"><div class="n">Overdue</div><div class="v">${esc(pesoShort(R.overdue))}</div><div class="small muted">past check-in date</div></div>
    </div>
    ${(O.months || []).map((m, i) => (i === 0 ? monthCard(m, true) : '')).join('')}
    <section class="card sec"><h2>Who still owes</h2>
      ${R.rows.length ? `<ul class="list">${R.rows.map((s) => `<li><div class="w"><b>${esc(s.guest)}</b>${s.checkIn < today ? '<span class="pill late">overdue</span>' : ''}
        <br><span class="small muted">#${esc(s.no)} · ${esc(cabinsText(s.cabins))} · check-in ${esc(shortDay(s.checkIn))} · total ${esc(peso(s.total))}, paid ${esc(peso(s.paid))}</span></div>
        <span class="a red">${esc(peso(s.due))}</span></li>`).join('')}</ul>${R.count > R.rows.length ? '<p class="small muted">…and ' + esc(R.count - R.rows.length) + ' more in the app.</p>' : ''}`
      : '<p class="muted">Nobody owes anything. 🎉</p>'}
    </section>
    <section class="card sec"><h2>Stays — next 30 days</h2>
      ${nowIn.length ? `<p class="dayhead">In the cabins now</p><ul class="list">${nowIn.map((s) => stayLine(s, true)).join('')}</ul>` : '<p class="small muted">No guests in the cabins tonight.</p>'}
      ${Object.keys(byDay).sort().map((d) => `<p class="dayhead">${esc(dayText(d))}</p><ul class="list">${byDay[d].map((s) => stayLine(s, false)).join('')}</ul>`).join('')}
      ${!coming.length ? '<p class="small muted" style="margin-top:8px">No check-ins in the next 30 days yet.</p>' : ''}
    </section>
    ${(O.months || [])[1] ? monthCard(O.months[1], false) : ''}
    <p class="small muted">To change a booking or a payment, tell Jay — this page only shows what's in the app. No phone numbers are shown here.</p>
    <button class="btn secondary" id="back2">‹ Back to disbursements</button>`;
  ['back', 'back2'].forEach((id) => document.getElementById(id).onclick = goBack);
}

function renderLogin() {
  app.innerHTML = `
    <div class="top"><div><p class="eyebrow">Cabins by the Generals</p><h1>Disbursements</h1></div></div>
    <p class="muted">Enter your PIN to add expenses and owner advances to the CBTG app.</p>
    ${msgHtml()}
    <form id="f" class="card">
      <label for="pin" class="small muted">Your PIN</label>
      <input id="pin" class="pin" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" maxlength="6" required>
      <button class="btn primary" ${state.busy ? 'disabled' : ''}>${state.busy ? 'Checking…' : 'Log in'}</button>
    </form>
    <p class="small muted">Tip (iPhone): open this in Safari, tap Share → “Add to Home Screen”.</p>`;
  const f = document.getElementById('f'), pin = document.getElementById('pin');
  if (!state.busy) pin.focus();
  f.onsubmit = (e) => { e.preventDefault(); if (pin.value.trim()) login(pin.value.trim()); };
}

load();
if (state.pin) login(state.pin); else render();
</script>
</body>
</html>
